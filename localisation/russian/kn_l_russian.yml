l_russian:
 kn_category:0 "Крестики-нолики"
 kn_category_desc:0 "Предложите любой существующей стране сыграть в крестики-нолики. Политические отношения не имеют значения. Одна страна может участвовать только в одной партии или приглашении одновременно. ИИ принимает вызов и ходит при смене игрового дня."
 kn_invite:0 "Предложить игру: [FROM.GetName]"
 kn_invite_desc:0 "Мы играем крестиками и ходим первыми. У получателя появится окно с кнопками принятия и отказа. Приглашение действует 7 игровых дней.\n\nПосле отправки действует общий кулдаун 90 игровых дней на новые приглашения. Отказ и отмена не сбрасывают кулдаун."
 kn_invite_tt:0 "Отправить бесплатное приглашение стране §Y[FROM.GetName]§!."
 kn_show_board:0 "Открыть крестики-нолики"
 kn_show_board_desc:0 "Показать приглашение, текущую партию или последний результат."
 kn_title:0 "КРЕСТИКИ-НОЛИКИ"
 kn_opponent_label:0 "Соперник: [?kn_opponent.GetName]\nВаш знак: [GetKnMark]"
 kn_status_label:0 "[GetKnStatus]"
 kn_rules:0 "Три своих знака в ряд — победа.\nКрестики начинают."
 kn_mark_x:0 "крестики (X)"
 kn_mark_o:0 "нолики (O)"
 kn_status_incoming:0 "Вас приглашают сыграть!\nПринять предложение?"
 kn_status_outgoing:0 "Приглашение отправлено.\nЖдём ответа соперника."
 kn_status_your_turn:0 "§GВаш ход!§! Нажмите пустую клетку."
 kn_status_wait:0 "Ход соперника. Ожидайте."
 kn_status_win:0 "§GВы победили!§!"
 kn_status_loss:0 "§RВы проиграли.§!"
 kn_status_draw:0 "Ничья! Поле заполнено."
 kn_status_declined:0 "Приглашение отклонено."
 kn_status_cancelled:0 "Приглашение отменено."
 kn_status_expired:0 "Срок приглашения истёк."
 kn_status_unavailable:0 "Партия прекращена: соперник недоступен."
 kn_accept_label:0 "Принять приглашение"
 kn_decline_label:0 "Отклонить"
 kn_cancel_label:0 "Отменить / сдаться"
 kn_accept_label_tt:0 "Начать партию. Пригласившая страна ходит первой."
 kn_decline_label_tt:0 "Отклонить приглашение и освободить обе страны для новой игры."
 kn_cancel_label_tt:0 "Отменить ожидающее приглашение. Если игра уже началась — сдаться и засчитать победу сопернику."
 kn_close_tt:0 "Скрыть окно. Игра продолжается; открыть её снова можно через решения."
 kn_cell_tt:0 "Поставить свой знак. Можно ходить только в свой ход и только в пустую клетку."
 kn_watch_category:0 "Наблюдение за партиями"
 kn_watch_category_desc:0 "Здесь появляются активные партии других стран. Самому участвовать в игре не нужно. Одна запись на партию — по стране, играющей крестиками."
 kn_watch_empty:0 "Нет активных чужих партий"
 kn_watch_empty_desc:0 "Для наблюдения две другие страны должны принять приглашение и начать игру. Ожидающие приглашения здесь не отображаются."
 kn_watch_match:0 "Наблюдать партию: [FROM.GetName]"
 kn_watch_match_desc:0 "Посмотреть текущую партию этой страны за крестики. Поле обновляется после ходов участников. Наблюдение не занимает слот вашей собственной игры."
 kn_watch_title:0 "НАБЛЮДЕНИЕ"
 kn_watch_players:0 "X: [?kn_watch_x.GetName]\nO: [?kn_watch_o.GetName]"
 kn_watch_status:0 "[GetKnWatchStatus]"
 kn_watch_hint:0 "Вы зритель. Ходят только участники.\nДругую партию можно выбрать в решениях."
 kn_watch_close_tt:0 "Закрыть наблюдение и вернуться к своему окну игры."
 kn_watch_unavailable:0 "Эта партия больше недоступна."
 kn_watch_x_won:0 "§GПобедили крестики: [?kn_watch_x.GetName]§!"
 kn_watch_o_won:0 "§GПобедили нолики: [?kn_watch_o.GetName]§!"
