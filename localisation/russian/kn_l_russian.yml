 kn_watch_x_turn:0 "Ход крестиков: [?kn_watch_x.GetName]"
 kn_watch_o_turn:0 "Ход ноликов: [?kn_watch_o.GetName]"
 kn_invitation_cooldown_tt:0 "Прошло 90 дней с отправки последнего приглашения."
