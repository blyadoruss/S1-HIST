 abt_text_mechanic_africa:0 "African Front\nGreen: captured by your side. Red: not controlled.\nEach Egyptian state held by the Axis gives the Axis +1% and the Allies -1%. Each Libyan state held by the Allies does the reverse.\nThe modifier affects military factory output and the production efficiency cap. Retaking a state reverses its effect."
 abt_text_mechanic_africa_egypt:0 "African Front\nGreen: Axis control. Red: no Axis control.\nEach captured Egyptian state: +1%. Each Libyan state captured by the Allies: -1%.\nAffects military factory output and the production efficiency cap. Recalculated when territory changes hands."
