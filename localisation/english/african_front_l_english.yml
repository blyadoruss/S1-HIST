 SOV_infrastructure_effort_nsb:0 "Развитие инфраструктуры"
 SOV_infrastructure_effort_nsb_desc:0 "$SOV_infrastructure_effort_desc$"
 SOV_heavy_industry:0 "Тяжелая промышленность"
 SOV_heavy_industry_desc:0 "Наши проекты по индустриализации продолжают набирать обороты, но пришло время сделать ставку на тяжелую промышленность — вскоре нам понадобится больше военной техники."
 SOV_finish_the_five_year_plan:0 "[GetFinishTheFiveYearPlanName]"
 SOV_finish_the_five_year_plan_desc:0 "[GetFinishTheFiveYearPlanDesc]"
 SOV_improve_railway_network:0 "Improve Railway Network"
 SOV_third_five_year_plan:0 "[GetThirdFiveYearPlanName]"
 SOV_third_five_year_plan_desc:0 "[GetThirdFiveYearPlanDesc]"
 SOV_reorganize_the_pc_of_heavy_industry:0 "[GetReorganizeThePcOfHeavyIndustryName]"
 SOV_reorganize_the_pc_of_heavy_industry_desc:0 "Наш предыдущий упор на тяжелую промышленность со всей очевидностью выявил неэффективность управления. Чтобы система снова работала нормально, нужно назначать на должности подходящих людей."
 SOV_industrial_modernization:0 "Модернизация промышленности"
 SOV_industrial_modernization_desc:0 "Западные страны быстро внедряют новые методы производства и технологии. Мы не должны довольствоваться тем, что не отстаем от них — мы должны их обогнать!"
 SOV_increase_state_reserves:0 "Увеличить государственные резервы"
 SOV_increase_state_reserves_desc:0 "Нашей растущей промышленности отчаянно требуются все новые и новые ресурсы. Мы не всегда можем гарантировать рост производства ресурсов и потому должны по возможности создавать резервы."
 SOV_shift_to_armaments_production:0 "Перейти к производству оружия"
 SOV_shift_to_armaments_production_desc:0 "Близится война. Мы не знаем, кто нанесет удар первым, но рано или поздно атакуют и нас. К этому нужно готовиться заранее."
 SOV_optimize_production_lines:0 "Оптимизировать производственные линии"
 SOV_optimize_production_lines_desc:0 "Другие страны успешно внедряют на своих заводах т. н. фордизм, чтобы максимизировать выход продукции. Мы должны брать с них пример."
 SOV_steel_casting_industry:0 "Сталелитейная индустрия"
 SOV_steel_casting_industry_desc:0 "Наша металлургическая промышленность находится на острие нашего индустриального роста, но ее можно сделать еще эффективнее, приняв новые методы производства."
 SOV_synthetic_rubber:0 "Синтетический каучук"
 SOV_synthetic_rubber_desc:0 "Настанет день, когда мы больше не сможем полагаться на импорт зарубежной резины. Когда это время придет, мы должны быть готовы удовлетворить свою потребность в резине силами внутреннего производства."
 SOV_oil_production:0 "Добыча нефти"
 SOV_oil_production_desc:0 "Следующий логичный шаг как в нашем промышленном развитии, так и в модернизации армии — повысить моторизацию. Для этого потребуются большие запасы горюче-смазочных материалов. К счастью, у нас есть большие месторождения нефти, которую как раз можно задействовать в моторизации, если мы разовьем необходимую промышленность."
 SOV_restoration_and_development:0 "Восстановление и развитие"
 SOV_restoration_and_development_desc:0 "Теперь, когда война закончилась, мы можем вернуться к мирному развитию промышленности и улучшению качества жизни народа."
 SOV_fourth_five_year_plan:0 "[GetFourthFiveYearPlanName]"
 SOV_fourth_five_year_plan_desc:0 "Чтобы полностью устранить последствия войны, потребуется время, но задав нужные цели, мы можем уже сейчас добиться определенного прироста производства."
 SOV_found_the_comecon:0 "Основать СЭВ"
 SOV_found_the_comecon_desc:0 "Война показала, что нам следует наращивать сотрудничество и способствовать экономическому развитию наших друзей и партнеров. Для этого мы создадим организацию, координирующую торговлю и экономическое развитие наших стран."
 SOV_the_common_economic_space_initiative:0 "Инициатива об экономической взаимопомощи"
 SOV_the_common_economic_space_initiative_desc:0 "Наращивать экономику проще, имея доступ к новым рынкам для наших товаров и необходимые ресурсы, но обходясь при этом без лишних преград торговле. Нужно создать организацию, которая бы способствовала этому."
 SOV_found_the_warsaw_pact:0 "Заключить Варшавский договор"
 SOV_found_the_warsaw_pact_desc:0 "По всей Европе дует ветер перемен, и становится всё очевиднее, что нам необходим договор о коллективной безопасности, чтобы противостоять любой агрессии со стороны прогнившего Запада. С этой целью нам следует официально учредить Организацию Варшавского договора — военное дополнение к СЭВ."
 SOV_no_time_for_peace:0 "Нет времени на мир"
 SOV_no_time_for_peace_desc:0 "Как бы мы этого ни желали, на долгий мир надежды мало. Новое оружие и технологии сделают войну более разрушительной, чем когда-либо, и мы, к сожалению, должны вкладывать ресурсы, заработанные тяжким трудом, чтобы не отставать от противников."
 SOV_national_specialists:0 "Национальные специалисты"
 SOV_national_specialists_desc:0 "Наше экономическое развитие должно проводиться в основном теми, кто знаком с нашей страной. Иностранцам понадобится много времени, чтобы овладеть таким знанием, и, что еще хуже, это знание они потом могут увезти с собой."
 SOV_foreign_experts:0 "Иностранные эксперты"
 SOV_foreign_experts_desc:0 "Есть немало иностранных экспертов, способных многому научить нас в вопросах улучшения экономики. К счастью, большая их часть — капиталисты, а следовательно, их можно купить."
 SOV_eastern_development:0 "Восточное развитие"
 SOV_eastern_development_desc:0 "Земли Дальнего Востока за Уральскими горами таят в себе огромный нетронутый запас полезных ископаемых и обширные площади для промышленной застройки. Нужно подготовить их для наших крупных проектов."
 SOV_develop_the_urals:0 "Развивать Урал"
 SOV_develop_the_urals_desc:0 "Вероятно, главная угроза нашей стране будет исходить из Европы. Развивая территорию за Уралом, мы создадим промышленный резерв, достичь которого вряд ли сможет даже самый дальнобойный бомбардировщик."
 SOV_the_ussr_academy_of_sciences:0 "[GetTheUssrAcademyOfSciencesName]"
 SOV_the_ussr_academy_of_sciences_desc:0 "Чтобы сохранять конкурентоспособность в области прикладных наук, мы должны находиться также и на острие развития теории. У нас уже есть достаточно развитая Академия наук, но дополнительное финансирование позволит снабдить ее исследовательской инфраструктурой мирового уровня."
 SOV_national_academies_of_sciences:0 "Национальная академия наук"
 SOV_national_academies_of_sciences_desc:0 "Следует поощрить партнерские страны создавать у себя организации, аналогичные нашей Академии наук, чтобы усиливать свой научный потенциал."
 SOV_transformation_of_nature:0 "Преобразование природы"
 SOV_transformation_of_nature_desc:0 "Наше научное сообщество раздвигает границы возможного, и нам становятся доступны самые масштабные и влиятельные проекты."
 SOV_transformation_of_nature_alt:0 "$SOV_transformation_of_nature$"
 SOV_transformation_of_nature_alt_desc:0 "$SOV_transformation_of_nature_desc$"
 SOV_transpolar_flights:0 "Transpolar Flights"
 SOV_expand_the_aircraft_industry:0 "Расширить авиационную индустрию"
 SOV_expand_the_aircraft_industry_desc:0 "В будущих войнах наша авиация должна будет защищать небо от врагов, вооруженных самым современным оборудованием. Мы должны быть уверены, что у нас не только сравнимые со вражескими самолеты, но и что этих самолетов достаточно."
 SOV_modernize_aircraft_facilities:0 "Модернизировать аэродромы"
 SOV_modernize_aircraft_facilities_desc:0 "И лучший самолет в мире скоро станет бесполезен, если будет взлетать с кочковатой полосы и обслуживаться в сарае с прохудившейся крышей. Чтобы гарантировать максимальную эффективность ВВС, нужно организовать лучшую из возможных инфраструктуру."
 SOV_merge_aircraft_plants:0 "Объединить авиазаводы"
 SOV_merge_aircraft_plants_desc:0 "Конкуренция между проектировщиками не только порождает в них тягу к улучшению, но и увеличивает расход ресурсов, что очень некстати. Нужно объединить конструкторские бюро, чтобы избавиться от подобных расходов."
 SOV_found_the_jet_institute:0 "Разрабатывать реактивную авиацию"
 SOV_found_the_jet_institute_desc:0 "У современных поршневых двигателей есть свои ограничения. Самолеты будущего должны будут полагаться на другие технологии. Мы должны основать институт по изучению реактивных двигателей, чтобы нас не опередили иностранные производители."
 SOV_increase_aircraft_production:0 "Увеличить производство самолетов"
 SOV_increase_aircraft_production_desc:0 "В последнее время мы делаем особенно сильный упор на безопасность, что начало отрицательно влиять на объем производства новых самолетов. Можно сэкономить значительное количество ресурсов, отказавшись от самых избыточных систем безопасности и сохранив при этом надежность и эффективность наших ВВС."
 SOV_foster_flying_clubs:0 "Опекать летные клубы"
 SOV_foster_flying_clubs_desc:0 "Обучать новых пилотов, ни разу до того не видевших самолета, дорого, но сейчас многие молодые люди увлечены авиацией и при некоторой поддержке могут стать очень способными пилотами, которых затем легче будет обучить ведению воздушного боя."
 SOV_women_in_aviation:0 "Женщины в авиации"
 SOV_women_in_aviation_desc:0 "В прошлом отсталые люди объявляли авиацию исключительно мужским делом, но женщины всего мира не стали поддаваться на провокацию и доказали, что могут летать ничуть не хуже своих коллег-мужчин. Нужно поощрять наших женщин пробовать себя в авиации, чтобы затем выбрать из них наиболее способных пилотов."
 SOV_raskovas_aviation_group:0 "[GetRaskovasAviationGroupName]"
 SOV_raskovas_aviation_group_desc:0 "[GetRaskovasAviationGroupDesc]"
 SOV_intensify_pilot_training_program:0 "Усилить программу подготовки летчиков"
 SOV_intensify_pilot_training_program_desc:0 "Чтобы сохранять конкурентоспособность, наши ВВС должны сражаться и летать в любых обстоятельствах. Лучший способ достичь этого — готовить наших пилотов по наивысшим стандартам. То, чего нам недостает в численности или технике, мы будем восполнять мастерством."
 SOV_expand_aviation_institutes:0 "Расширить институт авиации"
 SOV_expand_aviation_institutes_desc:0 "Главная преграда к увеличению размера наших ВВС — допустимая численность обучаемых пилотов. Расширив наши летные школы, мы заложим основы создания более масштабных и подготовленных ВВС."
 SOV_ground_support:0 "Наземная поддержка"
 SOV_ground_support_desc:0 "Главной задачей нашей авиации должна стать поддержка наземных войск. Этот фундаментальный факт необходимо учитывать при каждом решении."
 SOV_long_range_aircraft:0 "Авиация дальнего действия"
 SOV_long_range_aircraft_desc:0 "Технология развилась до того этапа, когда наши бомбардировщики могут достичь любой точки вражеского государства и быстро лишить его военного потенциала. Сухопутные войска нужны лишь для того, чтобы сдерживать фронт до этого момента."
 SOV_the_modern_war_in_the_skies:0 "Современная война в небе"
 SOV_the_modern_war_in_the_skies_desc:0 "Со времен бипланов, сражающихся один на один над окопами, боевая авиация прошла большой путь. Сегодня она по природе своей индустриальна и должна поддерживать рабочий темп, чтобы круглые сутки не ослаблять давление на противника. Мы должны учитывать этот факт и действовать соответственно."
 SOV_expand_the_red_fleet:0 "Расширить [GetSovietArmyAdjectiveBasedOnIdeology][GetSovietArmyBasedOnIdeology_RU_END_NOM] флот"
 SOV_expand_the_red_fleet_desc:0 "[GetExpandTheRedFleetDesc]"
 SOV_reinforce_western_naval_bases:0 "Укрепить западные морские базы"
 SOV_reinforce_western_naval_bases_desc:0 "Балтийский флот на своих базах крайне незащищен. Нужно выделить ресурсы на оборону его якорных стоянок и улучшить его ремонтопригодность."
 SOV_reinforce_northern_naval_bases:0 "Укрепить северные морские базы"
 SOV_reinforce_northern_naval_bases_desc:0 "Несмотря на то что Мурманск расположен к северу от Полярного круга, это наш единственный порт, не замерзающий круглый год и имеющий доступ к открытому океану. Нужно развивать его дальше, чтобы получить доступ ко всему миру."
 SOV_reinforce_southern_naval_bases:0 "Укрепить южные морские базы"
 SOV_reinforce_southern_naval_bases_desc:0 "На первый взгляд Черное море может показаться второстепенным театром военных действий, но если мы утратим контроль над ним, то откроем все наши южные территории для вторжения противника, как случилось в Крымской войне. Такого повторяться не должно. Нам следует укрепить морские базы в этом регионе."
 SOV_reinforce_eastern_naval_bases:0 "Укрепить восточные морские базы"
 SOV_reinforce_eastern_naval_bases_desc:0 "Даже после унижения 1905 года японцы не перестали строить планы по захвату нашей территории. Мы должны быть готовы к войне с ними, а это значит, что требуется усилить наши морские базы в регионе."
 SOV_expand_shipbuilding_plants:0 "Расширить судостроительные заводы"
 SOV_expand_shipbuilding_plants_desc:0 "Наша география вынуждает нас строить верфи по всей стране, чтобы поддерживать разные флоты. Следовательно, наращивать строительство кораблей нужно тоже сразу везде."
 SOV_merge_naval_plants:0 "Объединить судостроительные заводы"
 SOV_merge_naval_plants_desc:0 "Проектировка и строительство кораблей — долгий процесс, а избыточная конкуренция снижает его эффективность. Надо объединить наши конструкторские бюро, чтобы избавиться от напрасной траты усилий."
 SOV_pc_of_the_ussr_navy:0 "[GetPcOfTheUssrNavyName]"
 SOV_pc_of_the_ussr_navy_desc:0 "Наш флот становится все более современным и эффективным. Пришло время признать его родом войск, не уступающим по важности армии. Для этого мы первым делом разрешим флоту образовать свою структуру управления, отдельную от армии."
 SOV_surface_warfare:0 "Надводные боевые действия"
 SOV_surface_warfare_desc:0 "Крупные корабли требуют уймы времени и ресурсов и в результате устаревают еще до окончания их строительства. Относительно небольшие корабли строятся гораздо быстрее и потому им проще не отставать от прогресса. Надо сосредоточиться на строительстве легких кораблей и сделать из них основную ударную силу флота."
 SOV_submarine_warfare:0 "Стратегия подводного боя"
 SOV_submarine_warfare_desc:0 "Подводные лодки обеспечивают значительное преимущество в морских сражениях. Хорошо спроектированная современная подлодка практически незаметна до тех пор, пока не выпустит торпеды, нейтрализовав крупный корабль, многократно превосходящий ее размерами и стоимостью. Нужно сосредоточиться на строительстве подлодок и сделать их основной наступательной силой нашего флота."
 SOV_offensive_maritime_strategy:0 "Наступательная морская стратегия"
 SOV_offensive_maritime_strategy_desc:0 "Мы не можем позволить себе сидеть и ждать, когда враг придет к нам. Мы должны взять инициативу в свои руки и атаковать противника везде, где только сумеем."
 SOV_an_oceangoing_navy:0 "Океанский флот"
 SOV_an_oceangoing_navy_desc:0 "$SOV_ocean_going_navy_desc$"
 SOV_mine_warfare:0 "Минная война"
 SOV_mine_warfare_desc:0 "Пытаться защитить все наше побережье кораблями неэкономично. Поставив минные заграждения в стратегических местах, мы сможем отвадить или хотя бы повредить любой вражеский флот, пытающийся подойти к нашим берегам."
 SOV_long_range_raiders:0 "Рейдеры дальнего действия"
 SOV_long_range_raiders_desc:0 "Из-за большой удаленности наших морских баз от главных маршрутов поставок нашим подлодкам будет трудно дойти до богатых «охотничьих угодий». Надо разработать подводные лодки с увеличенным радиусом действия, чтобы наносить противнику чувствительные удары."
 SOV_advanced_maneuvers:0 "Усовершенствованные маневры"
 SOV_advanced_maneuvers_desc:0 "Нет смысла иметь большие и современные корабли, если команда не умеет с ними обращаться. Нужно проводить регулярные крупномасштабные учения, чтобы тренировать наших матросов и офицеров вести современную морскую войну."
 SOV_expand_the_morskaya_aviatsiya:0 "Расширить морскую авиацию"
 SOV_expand_the_morskaya_aviatsiya_desc:0 "Самолеты уже значительно изменили природу наземных боевых действий. В будущем они будут представлять значительную угрозу даже для самых современных кораблей. Нам нужно обзавестись современной морской авиацией, чтобы защищать свой флот."
 SOV_naval_infantry:0 "Морская пехота"
 SOV_naval_infantry_desc:0 "[GetNavalInfantryDesc]"
 SOV_found_the_pcdi:0 "[GetFoundThePcdiName]"
 SOV_found_the_pcdi_desc:0 "[GetFoundThePcdiDesc]"
 SOV_pc_of_mechanical_engineering:0 "[GetPcOfMechanicalEngineeringName]"
 SOV_pc_of_mechanical_engineering_desc:0 "Нашей промышленности удается производить все более большие и сложные станки и другую тяжелую технику. Настало время образовать отдельную правительственную структуру для координации этих проектов."
 SOV_superior_war_machines:0 "Превосходные военные машины"
 SOV_superior_war_machines_desc:0 "За последнее десятилетие танки и бронетехника значительно развились. Обладая большой индустрией, способной производить и снабжать их, мы можем создавать превосходные боевые машины и массово задействовать их в битвах с врагом."
 SOV_the_means_to_wage_war:0 "Средства ведения войны"
 SOV_the_means_to_wage_war_desc:0 "Самолеты, пушки и танки часто привлекают к себе больше всего внимания и лучше всего выглядят на парадах, но обычного солдата куда сильнее заботит качество его винтовки и удобство сапог. Мы должны признать, что такие факторы не менее важны для ведения войн, чем любой самолет-истребитель или тяжелая гаубица."
 SOV_soviet_artillery:0 "[ROOT.GetAdjective]ая артиллерия"
 SOV_soviet_artillery_desc:0 "Сегодняшние войны выигрываются точным и точечным ведением огня. Мы сосредоточим наши усилия не только на том, чтобы улучшить производимые орудия, но и на том, чтобы использовать их как можно более эффективно."
 SOV_pc_of_mortar_armament:0 "[GetPcOfMortarArmamentName]"
 SOV_pc_of_mortar_armament_desc:0 "Скромные минометы быстро становятся в наших войсках основным оружием поддержки непрямым огнем. Мы должны стремиться производить как можно больше минометов всех размеров и образовать правительственный орган, который будет заниматься исключительно этим."
 SOV_development_of_tankograd:0 "Развитие танкограда"
 SOV_development_of_tankograd_desc:0 "Наша страна занимает огромную площадь, и перевозить запчасти с одного завода на другой в ней нерентабельно. Вместо этого нужно реализовать вертикальную интеграцию наших танковых заводов — с одного конца поступает сталь, с другого выходят готовые танки."
 SOV_merge_tank_and_materiel_plants:0 "Объединить танковые заводы и заводы маттехобеспечения"
 SOV_merge_tank_and_materiel_plants_desc:0 "Танки и артиллерия, вероятно, лучше всего приспособлены для массового производства с его эффектом масштаба. Нужно начать объединять танковые заводы и заводы МТО, чтобы воспользоваться этим."
 SOV_strengthen_the_mobilization_plan:0 "Усилить план мобилизации"
 SOV_strengthen_the_mobilization_plan_desc:0 "Нашим главным военным преимуществом всегда была обширная территория нашей страны и ее большое население, но когда дело касается мобилизации солдат на фронт, два этих фактора могут мешать друг другу. Нам надо постоянно улучшать и перерабатывать мобилизационные планы, чтобы в случае войны мы смогли быстро собрать войска."
 SOV_military_engineering_university:0 "Университет военных инженеров"
 SOV_military_engineering_university_desc:0 "Многие утверждают, что с развитием танков и самолетов окопной войне пришел конец, но ясно, что ремесло военного инженера актуально по-прежнему. Мы должны основать учебное заведение, где изучались бы современные методы возведения полевых укреплений."
 SOV_leningrad_polytechnical_institute:0 "[195.GetName] политехнический институт"
 SOV_leningrad_polytechnical_institute_desc:0 "[195.GetName] политехнический институт, наша главная инженерная школа, уже давно обеспечивает страну инженерами и конструкторами. Нужно расширить его, чтобы у нас всегда были лучшие кадры на новые места в растущей промышленности."
 SOV_soviet_atomic_bomb_project:0 "[ROOT.GetAdjective]ий проект атомной бомбы"
 SOV_soviet_atomic_bomb_project_desc:0 "Мы знаем, что ученые других стран усердно трудятся над разработкой методов по обращению фундаментальных сил вселенной в новый вид оружия. Мы отстаем от них, но можем использовать их наработки, чтобы продвинуться самим и не утратить паритет вооружений."
 SOV_move_industry_to_the_urals:0 "Эвакуировать промышленность на Урал"
 SOV_move_industry_to_the_urals_desc:0 "Война пришла к нам, и родина теперь в опасности. Хоть наши войска и будут драться до последнего патрона, не отдавая врагу ни пяди земли, этого, учитывая всю мощь противника, может оказаться недостаточно. Нужно эвакуировать заводы в безопасное место, пока враги не захватили их."
 SOV_the_road_of_life:0 "Дорога жизни"
 SOV_the_road_of_life_desc:0 "Теперь, когда несколько наших городов находятся в блокаде, мы должны любой ценой доставить туда войска, чтобы поддержать эти города и помочь им выстоять."
 SOV_the_molotov_line:0 "[GetTheMolotovLineName]"
 SOV_the_molotov_line_desc:0 "Недавние перемены в политической географии Европы переместили нашу западную границу заметно дальше. Все прежние планы по фортификации теперь устарели. Мы должны создать линию вдоль нашей новой границы, чтобы замедлить любого атакующего врага до тех пор, пока не мобилизуем войска для контратаки."
 SOV_improve_the_stalin_line:0 "[GetImproveTheStalinLineName]"
 SOV_improve_the_stalin_line_desc:0 "Наша западная граница слишком протяженна, чтобы укрепить ее по всей длине. Вместо этого мы можем построить сеть укреплений, направляющих атаки противника в предсказуемые места, где им можно будет массово противостоять."
 SOV_the_defense_of_moscow:0 "Оборона Москвы"
 SOV_the_defense_of_moscow_desc:0 "Враг стоит у ворот Москвы. Пора отбросить и одолеть его в решающей битве, как уже было с Наполеоном!"
 SOV_impregnable_forts:0 "Неприступные укрепления"
 SOV_impregnable_forts_desc:0 "[ROOT.GetAdjective]ое инженерное мастерство сейчас позволяет создавать поистине неприступные укрепления, способные выстоять даже при сильнейшей бомбардировке и практически неуязвимые при штурме. При большом количестве боезапаса и припасов такие укрепления могут, если потребуется, отражать вражеские атаки годами."
 SOV_protect_the_white_sea_baltic_canal:0 "Защита Беломорско-Балтийского канала"
 SOV_protect_the_white_sea_baltic_canal_desc:0 "Канал между Балтийским и Белым морями — чудо современной инженерной мысли. Нельзя допустить, чтобы он попал в руки врага."
 SOV_far_east_fortification:0 "Укрепление Дальнего Востока"
 SOV_far_east_fortification_desc:0 "Еще со времен войны 1905 г. с Японией мы внимательно следим за этим регионом. Не секрет, что японская армия смотрит на наши дальневосточные владения с беззастенчивой жадностью. Мы должны подготовиться к конфронтации в этом регионе и предпринять шаги по замедлению вражеских атак — это даст нам время доставить туда войска с запада России."
 SOV_restore_cossack_units:0 "Восстановить казацкие отряды"
 SOV_restore_cossack_units_desc:0 "В час нужды родина готова принять любого, кто хочет защищать ее. Мы рады всем, кто готов взять в руки оружие, и с радостью это оружие предоставим."
 SOV_cohesion_first:0 "Целостность прежде всего"
 SOV_cohesion_first_desc:0 "Последнее, что нам сейчас нужно, — снижение стандартов. Мы рады всем, кто желает служить в армии, но служить они будут в уже существующих войсках и обучаться по соответствующим военным стандартам."
 SOV_rehabilitated_military:0 "Восстановление военной мощи"
 SOV_rehabilitated_military_desc:0 "[GetRehabilitatedMilitaryName]"
 SOV_military_reorganization:0 "Реорганизация армии"
 SOV_military_reorganization_desc:0 "Наши попытки построить большую механизированную армию были похвальными, но непосильными для нас. Чтобы выиграть эту войну, мы должны сосредоточиться на оружии, помогавшем русской армии веками: пехоте и артиллерии. Для этого нужно будет в определенной мере нарушить существующую доктрину."
 SOV_desperate_measures:0 "Отчаянные меры"
 SOV_desperate_measures_desc:0 "В такой отчаянной ситуации мы должны предпринять меры, ранее считавшиеся невозможными. Все, что можно сделать, чтобы остановить вторжение, должно быть сделано."
 SOV_an_adaptable_army:0 "Адаптирующаяся армия"
 SOV_an_adaptable_army_desc:0 "Война идет в нескольких климатических зонах и на различных видах ландшафта. Чтобы победить, мы должны уметь сражаться в любых условиях и при любой погоде."
 SOV_lessons_of_war:0 "Уроки войны"
 SOV_lessons_of_war_desc:0 "Почти все планы, имевшиеся у нас до войны, не пережили столкновения с реальностью. Мы должны быть открыты урокам, которые преподает нам война, и не цепляться за устаревшие догмы. Лишь тогда мы сможем перейти от отступления к наступлению."
 SOV_penal_battalions:0 "Штрафные батальоны"
 SOV_penal_battalions_desc:0 "При отступлении многие способные в целом солдаты опозорились, побежав еще до того, как их позиции были захвачены, или еще как-то проявив недостойное нашей армии поведение. Просто арестовать или казнить их в такой ситуации значило бы лишить себя опытных бойцов. Надо образовать специальные отряды, где такие люди могли бы искупить свою вину в бою."
 SOV_organization_of_the_partisans:0 "Организация партизанских отрядов"
 SOV_organization_of_the_partisans_desc:0 "Солдаты на оккупированных территориях, оказавшиеся в тылу врага, предпочли унизительному плену дальнейшую борьбу. Вместе с рабочими и крестьянами этих мест они продолжили сражаться с захватчиками. Мы должны поддерживать их, чтобы они еще эффективнее сдерживали противника."
 SOV_smersh:0 "СМЕРШ"
 SOV_smersh_desc:0 "Мы должны ясно донести до всех граждан, что шпионы и вражеские агенты сейчас повсюду и любая досужая болтовня может выдать им ценную информацию, которую враг обратит себе на пользу."
 SOV_barrier_troops:0 "Заградительные отряды"
 SOV_barrier_troops_desc:0 "В бою часто царит хаос, и неудивительно, что иногда солдаты теряют связь с командованием. Нужно ввести специальные отряды, которые будут располагаться за линией фронта, собирать тех, кто потерялся, и возвращать их на фронт — а также арестовывать тех, кто предал товарищей, пытаясь бежать от воинского долга."
 SOV_experts_in_camouflage:0 "Эксперты маскировки"
 SOV_experts_in_camouflage_desc:0 "Чтобы достичь элемента неожиданности и поддерживать его, мы должны быть абсолютно уверены, что враг не обнаружит позиции или передвижения наших войск, пока не станет слишком поздно. Каждый солдат должен быть обучен искусству маскировки."
 SOV_keep_commissars_organization:0 "Сохранить комиссарскую организацию"
 SOV_keep_commissars_organization_desc:0 "Даже в нашей новой организации есть потребность в людях, которые проследят, чтобы армия оставалась безоговорочно лояльной правительству. Если солдаты потеряют в него веру, мы проиграем эту войну, причем быстро."
 SOV_adjoined_battle_priests:0 "Боевые священники"
 SOV_adjoined_battle_priests_desc:0 "Мощь и влияние церкви в нашей стране сейчас растет, и, возможно, пришло время допустить ее в военные дела. Армейские священники сделают все, чтобы солдаты знали, что Бог на нашей стороне, что в идеале повысит боевой дух и заставит простых солдат усерднее сражаться за свою страну."
 SOV_swap_to_political_advisors:0 "Военные политические советники"
 SOV_swap_to_political_advisors_desc:0 "Наша война — не просто спор двух наций за ресурсы, это состязание политических систем. Хоть мы и не можем допустить, чтобы политические вопросы диктовали боевые решения, нам все равно нужно проследить, чтобы эти вопросы принимались во внимание."
 SOV_the_glory_of_the_red_army:0 "Слава [GetSovietArmyAdjectiveBasedOnIdeology]ой армии"
 SOV_the_glory_of_the_red_army_desc:0 "Мы успешно выдержали наступление врага. Теперь пора нам самим перейти в наступление и гнать врага туда, откуда он пришел!"
 SOV_the_glory_of_the_red_army_alt:0 "$SOV_the_glory_of_the_red_army$"
 SOV_the_glory_of_the_red_army_alt_desc:0 "$SOV_the_glory_of_the_red_army_desc$"
 SOV_the_path_of_marxism_leninism:0 "Путь марксизма-ленинизма"
 SOV_the_path_of_marxism_leninism_desc:0 "Непогрешимое учение Маркса, Энгельса и Ленина вывело нашу страну из глубочайшей отсталости к технологическому и индустриальному равенству. Было бы глубочайшей ошибкой теперь менять курс. Нерушимый молот рабочего освободительного движения продолжает свой путь!"
 SOV_the_centre:0 "Центр"
 SOV_the_centre_desc:0 "Товарищ Сталин — величайший боец за нашу нацию. Нужно предоставить решения о будущем революции ему — он отлично с этим справится."
 SOV_socialism_in_one_country:0 "Социализм в отдельно взятой стране"
 SOV_socialism_in_one_country_desc:0 "Хотя нашей главной целью остается мировая революция, — и ее неизбежность доказана научно, — сперва мы должны построить социализм в своей стране, иначе из-за нашей неудачи застопорится освобождение рабочих в других частях света."
 SOV_the_stalin_constitution:0 "Сталинская конституция"
 SOV_the_stalin_constitution_desc:0 "Конституция 1924 года была неплохой попыткой организации государства после Гражданской войны, но она себя исчерпала. Нужна новая конституция. Прежде всего мы должны отметить неустанную работу товарища Сталина по усилению Союза и указать, что именно его гений и мудрость вели дело коммунизма вперед."
 SOV_the_zinovyevite_terrorist_center:0 "Зиновьевский троцкистский центр"
 SOV_the_zinovyevite_terrorist_center_desc:0 "Убийство товарища Кирова в 1934 г. показывает, что в партии есть те, кто вынашивает заговор против товарища Сталина и Союза в целом. Мы получили признания от нескольких заговорщиков, указывающие на других террористов. Зиновьевский заговор, организованный, без сомнения, Троцким или западными агентами (возможно, совместно), нужно вырезать, как раковую опухоль, пока он не распространился."
 SOV_secure_the_administration:0 "Проверить администрацию"
 SOV_secure_the_administration_desc:0 "После шокирующего признания террориста Зиновьева и его сообщников мы должны спросить себя — а на чьей стороне другие члены партии? Необходимо знать политическую позицию каждого члена Политбюро."
 SOV_the_collectivization_process:0 "Процесс коллективизации"
 SOV_the_collectivization_process_desc:0 "Нам еще немало предстоит, но несмотря на все перегибы в некоторых регионах, процесс коллективизации сельского хозяйства в Советском Союзе почти завершен и скоро обеспечит нам повышенную эффективность сельскохозяйственного сектора."
 SOV_the_anti_soviet_trotskyist_center:0 "Антисоветский троцкистский центр"
 SOV_the_anti_soviet_trotskyist_center_desc:0 "Расследование зиновьевского заговора выявило большую сеть террористов-антисоветчиков в нашей администрации. Некоторые из них даже не понимают толком, кому помогают! Терроризм нужно искоренить самыми решительными мерами."
 SOV_the_workers_dictatorship:0 "Диктатура рабочих"
 SOV_the_workers_dictatorship_desc:0 "Вся власть в нашем Союзе должна в конечном итоге принадлежать рабочим. Мы не можем позволить себе быть разобщенными и потому должны проследить, чтобы решения Политбюро всегда выражали волю рабочих."
 SOV_organization_centralization_discipline:0 "Централизация и дисциплина"
 SOV_organization_centralization_discipline_desc:0 "Во времена неопределенности народ обращается к Политбюро за стабильностью и указаниями. Нужно проследить, чтобы этот руководящий орган не только поддерживал решения товарища Сталина, но и объединялся в их исполнении."
 SOV_war_economy:0 "Военная экономика"
 SOV_war_economy_desc:0 "Очевидно, что капиталистические и реакционные страны близ наших границ планируют нанести нам удар в момент нашей слабости. Чем скорее мы переведем экономику на военные рельсы, тем лучше."
 SOV_the_military_conspiracy:0 "Заговор военных"
 SOV_the_military_conspiracy_desc:0 "Троцкистский заговор в нашей стране пробрался и в ряды военнослужащих. У нас теперь есть доказательства того, что ведущие генералы и даже маршалы спелись с зарубежными разведками и планировали свергнуть правительство! Нельзя, чтобы офицеры, дающие хоть малейший повод усомниться в их лояльности, оставались на постах, где они могут и дальше ослаблять нашу армию."
 SOV_the_bloc_of_rights_and_trotskyites:0 "Блок правых и троцкистов"
 SOV_the_bloc_of_rights_and_trotskyites_desc:0 "Мы наконец-то добрались до самого центра заговора в наших рядах. Николай Бухарин на самом деле состоял в троцкистско-зиновьевском блоке и, скорее всего, возглавлял в правительстве группу контрреволюционеров. У нас есть неопровержимые доказательства, и в решающем суде мы прольем свет на эти факты."
 SOV_behead_the_snake:0 "Обезглавить змею"
 SOV_behead_the_snake_desc:0 "Стало абсолютно ясно, что Союз не будет в безопасности, пока угроза троцкистского заговора не ликвидирована полностью. Хорошо было бы предать Троцкого суду и пролить свет на его антисоветскую деятельность, но нам такая роскошь недоступна. Единственный наш вариант — устранить его, чтобы лишить заговорщиков против правительства лидера и главного подстрекателя."
 SOV_stalins_cult_of_personality:0 "Культ личности Сталина"
 SOV_stalins_cult_of_personality_desc:0 "После раскрытия шокирующего заговора против Союза стало очевидно, что лишь дальновидное руководство товарища Сталина не дало стране скатиться в гражданскую войну или нечто худшее. Каждый советский гражданин, даже больше — каждый член рабочего класса во всем мире должен всегда быть благодарен товарищу Сталину за его неусыпный труд по защите революции."
 SOV_they_will_know_fear:0 "Они познают страх"
 SOV_they_will_know_fear_desc:0 "Наши враги научились бояться Красной армии и советского народа. Мы выдержали натиск противника, и теперь пришло время нанести ответный удар. Надо разработать новые военные машины, способные прорвать даже самую прочную оборону противника. Такие военные машины должны вселять страх в сердца врагов одним своим названием..."
 SOV_inheritor_of_the_mantle_of_lenin:0 "Продолжатель дела Ленина"
 SOV_inheritor_of_the_mantle_of_lenin_desc:0 "Товарищ Сталин всегда был ближайшим соратником и самым доверенным учеником Ленина. Он — самый преданный последователь учения Ленина, и будет только правильно, если Сталин унаследует непростую обязанность ведения страны по пути к коммунизму, а также подготовки к неизбежной мировой революции рабочих."
 SOV_brilliant_genius:0 "Настоящий гений"
 SOV_brilliant_genius_desc:0 "Товарищ Сталин, несомненно, самый гениальный человек из ныне живущих; он поведет нашу страну к новым высотам научного развития и позволит прогрессу всего человечества достичь небывалого размаха."
 SOV_the_faithful_servant_of_lenin:0 "Верный ленинец"
 SOV_the_faithful_servant_of_lenin_desc:0 "Ленин оставил нам самую сложную задачу в мировой истории — построить общество, где все люди будут по-настоящему равны, общество без угнетения, страдания и бедности. Никто не справится с этим лучше, чем товарищ Сталин, который был с Лениным на каждом шагу его пути и который теперь готов выполнить обещание, данное в ходе революции."
 SOV_ban_excessive_hero_worship:0 "Запретить чрезмерное поклонение"
 SOV_ban_excessive_hero_worship_desc:0 "Сейчас пошла мода на издание чрезмерно преувеличенных и хвалебных публикаций о личной жизни и детстве товарища Сталина. Эти публикации делаются с наилучшими намерениями, но все же они мешают делу революции, поскольку способствуют установлению ненужного культа и заменяют стремление к тщательному изучению трудов товарища Сталина слепым идолопоклонничеством."
 SOV_leader_of_the_party_and_the_people:0 "Лидер партии и народа"
 SOV_leader_of_the_party_and_the_people_desc:0 "Товарищ Сталин прилежно и умело выполняет свои нелегкие обязанности и пользуется безусловной поддержкой как партии, так и народа. Любое тщеславие и самовосхваление ему чужды. Он, вероятно, самый скромный человек в мире."
 SOV_great_commander:0 "Великий командующий"
 SOV_great_commander_desc:0 "Достижения товарища Сталина в военной теории и командовании так многочисленны, что их и не перечислить. Пусть предатель Троцкий и основал Красную армию, но именно товарищ Сталин сделал из нее эффективную силу, защищающую достижения рабочего класса."
 SOV_architect_of_communism:0 "Строитель коммунизма"
 SOV_architect_of_communism_desc:0 "Непоколебимая преданность товарища Сталина идеалам революции позволила ему видеть все сложности, связанные с построением социализма в отдельно взятой стране. Теперь, когда работа по строительству социализма идет полным ходом, он может начать обдумывать следующую важную задачу — переход от социализма к полноценному коммунизму."
 SOV_father_of_nations:0 "Отец народов"
 SOV_father_of_nations_desc:0 "Наш Союз — большая семья множества народов, а в каждой семье должен быть глава. Этот глава — товарищ Сталин, который следит, чтобы все его многочисленные дети обучались социалистическому мышлению, и ведет нас в светлое будущее. При необходимости он бывает строг, но всегда справедлив и честен."
 SOV_freedom_of_debate_unity_of_action:0 "Свобода обсуждений — единство действий"
 SOV_freedom_of_debate_unity_of_action_desc:0 "Управление страной и направление ее на верный путь — крайне непростой процесс, и мы должны иметь возможность открыто обсуждать разные варианты его реализации. Однако как только решение принято, долг каждого члена Политбюро, да и партии в целом — безоговорочно его поддерживать."
 SOV_the_construction_of_communism:0 "Строительство коммунизма"
 SOV_the_construction_of_communism_desc:0 "Строительство коммунизма не обойдется без трудностей и преград. Политбюро объединилось под руководством товарища Сталина, и мы должны сделать первые шаги на пути к коммунизму."
 SOV_the_left_opposition:0 "Левая оппозиция"
 SOV_the_left_opposition_desc:0 "Очевидно, что Советский Союз сбился с обещанного пути. Ходят даже разговоры о строительстве социализма в отдельно взятой стране — это значит, что рабочие остального мира будут предоставлены сами себе без всякой солидарности. Если товарищ Сталин не будет действовать, за дело возьмутся другие."
 SOV_the_fourth_international:0 "Четвертый интернационал"
 SOV_the_fourth_international_desc:0 "Сталинские марионетки в так называемом Третьем Интернационале показали себя полностью неспособными продвигать дело революции. Их видение коммунизма мало похоже на теории Маркса и Ленина, оно превращает мечту о рабочем государстве под управлением демократии в антиутопический кошмар. Нам нужен новый интернационал, который будет защищать революцию!"
 SOV_bring_old_trotskyists_back:0 "Вернуть старых троцкистов"
 SOV_bring_old_trotskyists_back_desc:0 "В ранние годы революции среди разных группировок в партии были часты напряженные споры. Некоторых несогласных с линией партии — в частности, Карла Радека и Евгения Преображенского — даже изгнали из ее рядов из-за незначительных разногласий. Возможно, простого жеста раскаяния от этих давних членов партии было бы достаточно, чтобы принять их обратно."
 SOV_organize_the_wreckers:0 "Организовать вредительство"
 SOV_organize_the_wreckers_desc:0 "Если Сталин и его подручные решат сопротивляться, а не действовать в интересах революции, мы должны быть готовы сражаться. В такой отчаянной ситуации не стоит отказываться даже от саботажа народной собственности. Саботаж должен проводиться точечно и не уничтожать великих достижений советских рабочих."
 SOV_integrate_smirnovs_bloc:0 "Интегрировать смирновский блок"
 SOV_integrate_smirnovs_bloc_desc:0 "Несколько старых троцкистов недавно были арестованы и заключены в тюрьму за то, что высказывались против сталинской диктатуры. Поговорив с кем надо, мы могли бы организовать их освобождение и отправку в изгнание, где они организуются вдали от политической паранойи. Они не забудут, кто именно помог им бежать."
 SOV_left_eliminate_right:0 "Искоренить правых"
 SOV_left_eliminate_right_desc:0 "В партии есть группировки, абсолютно несовместимые друг с другом. Если мы хотим захватить правительство и вернуть революцию на верный курс, нам нельзя отвлекаться на их распри. Раз «товарищ» Сталин так активно ищет внутренних врагов, мы могли бы обратить его внимание на кого нужно..."
 SOV_committee_in_exile:0 "Комитет в изгнании"
 SOV_committee_in_exile_desc:0 "Никогда нельзя знать наверняка, кто следующим станет жертвой паранойи Сталина. Мы должны подготовить тайные маршруты и убежища, чтобы вывозить из страны своих сторонников, если те вдруг станут целью очередной чистки."
 SOV_approach_tukhachevsky:0 "Обратиться к Тухачевскому"
 SOV_approach_tukhachevsky_desc:0 "Михаил Тухачевский, без сомнения, один из наших величайших военных мыслителей. Его теория о быстром продвижении в глубокий тыл противника объединенных войск не обошлась без критики, но он тем не менее еще пользуется поддержкой некоторых талантливых генералов. Если мы убедим его присоединиться к нашему делу, он станет бесценным союзником."
 SOV_approach_primakov:0 "Обратиться к Примакову"
 SOV_approach_primakov_desc:0 "Виталий Примаков — один из наших лучших командиров-кавалеристов. Его поддержка в борьбе за страну была бы бесценна."
 SOV_funds_for_the_cause:0 "Деньги на правое дело"
 SOV_funds_for_the_cause_desc:0 "То, что $SOV_lev_trotsky$ и другие находятся за границей, может сыграть нам на руку. Следует организовать по всему миру сбор средств на дело социализма и одновременно с этим втайне убеждать правительства поддержать нас оружием."
 SOV_left_opposition_coup:0 "Разжечь пламя"
 SOV_left_opposition_coup_desc:0 "Время пришло. Поднимем знамена в борьбе с тираном. Революция начнется заново!"
 SOV_the_vanguard_of_the_true_revolution:0 "Авангард истинной революции"
 SOV_the_vanguard_of_the_true_revolution_desc:0 "Пусть мир услышит о нашей революции. Мы призовем революционеров всего мира под свои знамена. Вместе мы можем одолеть Сталина и добиться победы революции."
 SOV_long_live_the_workers_government:0 "Да здравствует правительство рабочих!"
 SOV_long_live_the_workers_government_desc:0 "Теперь, когда мы отправились по долгому пути к истинному освобождению рабочего класса, нельзя поддаваться искушению заменить одно правительство элиты на другое. Наш союз должно возглавлять истинное правительство рабочих, собранное из рабочих и для рабочих."
 SOV_left_purges:0 "Убрать контрреволюционеров"
 SOV_left_purges_desc:0 "В стране хватает и других, вынашивавших нелюбовь к Сталину. Пока мы утверждаем свое правление, надо не допустить, чтобы эти люди начали формировать контрреволюционные ячейки, иначе у нас очень быстро начнется очередная гражданская война."
 SOV_the_builder_of_the_red_army:0 "Строитель Красной армии"
 SOV_the_builder_of_the_red_army_desc:0 "Какой бы она ни стала в будущем, неизменным останется одно: создатель Красной армии — $SOV_lev_trotsky$. Пора ему вернуться на свою прежнюю позицию и повести новую, усиленную Красную армию в бой."
 SOV_reigniting_the_revolutionary_spirit:0 "Пробуждение революционного духа"
 SOV_reigniting_the_revolutionary_spirit_desc:0 "Годы сталинистского правления приглушили революционное рвение нашего народа. Нашим рабочим твердили, что революция рано или поздно случится. Мы знаем, что это не так — при текущем развитии дел в мире огонь революции нужно разжигать в других, не столь развитых странах. Мы раздуем это пламя."
 SOV_the_permanent_revolution:0 "Вечная революция"
 SOV_the_permanent_revolution_desc:0 "Марксистская теория учит нас, что при подходящих обстоятельствах революция неизбежна, но сейчас такие обстоятельства явно не наступили или наступили не везде. Мы не должны мириться с этим и ждать мировой революции, до которой могут оставаться сотни лет. Рабочие и крестьяне всего мира страдают уже сейчас, сегодня, и их освобождение не может ждать."
 SOV_depoliticize_the_military:0 "Деполитизировать армию"
 SOV_depoliticize_the_military_desc:0 "Главная цель армии — защита рабочего класса. Наши солдаты по большей части уже принадлежат к этому классу и, следовательно, не нуждаются в присмотре свыше. Что еще важнее, Красная армия должна быть сосредоточена на своей главной цели и не отвлекаться на политические игры."
 SOV_system_decentralization:0 "Децентрализация системы"
 SOV_system_decentralization_desc:0 "Сталин централизовал не только партию, но и всю страну. Такой подход очевидно контрреволюционен, он отбирает власть у рабочих и передает ее в руки коррумпированной элиты. Мы должны повернуть все вспять и дать возможность рабочим снова решать свою судьбу."
 SOV_strengthen_heavy_industry:0 "Усилить тяжелую промышленность"
 SOV_strengthen_heavy_industry_desc:0 "Тяжелая промышленность — сердце нашей экономики. Если мы хотим, чтобы революция не просто выживала, но и процветала, нужно усилить этот сектор дополнительно."
 SOV_a_global_class_struggle:0 "Всемирная классовая борьба"
 SOV_a_global_class_struggle_desc:0 "Борьба за освобождение рабочего класса по определению должна быть всемирной. Пока хоть одна страна поддерживает капиталистическую систему, революция в опасности. Как только рабочие всего мира осознают, что революция снова идет, они стекутся под наши знамена и поддержат нас в наших начинаниях."
 SOV_all_power_to_the_soviets:0 "Вся власть Советам"
 SOV_all_power_to_the_soviets_desc:0 "Революция началась с простой идеи о том, что народ должен самостоятельно решать свою судьбу, собирая советы рабочих, солдат и крестьян. Лишь потом эта система вернулась к той, где бюрократы, назначенные приказным порядком, принимают решения издалека. Когда же эти решения оказались неэффективными, наказывали за все рабочих. Хватит!"
 SOV_regional_development:0 "Развитие регионов"
 SOV_regional_development_desc:0 "Вместо того чтобы создать небольшое количество централизованных заводов и обречь остальную страну на голод, мы должны проследить, чтобы развитие промышленности распространилось по всему Союзу."
 SOV_autonomous_soviet_republics:0 "Автономные советские республики"
 SOV_autonomous_soviet_republics_desc:0 "В годы, последовавшие за революцией, сталинисты делали все, чтобы лишить регионы идентичности и подавить стремление рабочих в некоторых регионах к самоопределению. Контрреволюционный характер таких действий очевиден. Если рабочие в некоторых советских республиках желают обрести повышенную степень автономии, мы должны предоставить ее без колебаний."
 SOV_international_union_of_soviet_republics:0 "Интернациональный Союз советских республик"
 SOV_international_union_of_soviet_republics_desc:0 "Величайшее предательство нашей революции — идея, что социализм можно (и даже нужно) возводить лишь в отдельно взятой стране. Либо все рабочие во всех странах вместе построят социализм, либо его не построит никто. В разных государствах революция находится на разных этапах, но мы разделим свои ресурсы со всеми союзными нам странами, где рабочие контролируют правительство."
 SOV_the_onslaught_on_colonialism:0 "Расправа с колониализмом"
 SOV_the_onslaught_on_colonialism_desc:0 "Империализм и эксплуатация колоний — обязательные составляющие позднего капитализма. Удержание миллионов людей в рабстве дает нам огромный революционный потенциал, который можно с легкостью использовать. Угнетенные народы колониальных империй жаждут вздохнуть свободно, и мы освободим их от цепей."
 SOV_carry_revolution_east:0 "Нести революцию на восток"
 SOV_carry_revolution_east_desc:0 "Жестокая эксплуатация африканских колоний не дала местным обществам развиться до того уровня, на котором революция может одержать победу. В более развитых странах Азии дело обстоит по-другому: там существует большой революционный потенциал, который ждет, чтобы его выпустили на свободу."
 SOV_the_end_of_the_imperialist_era:0 "Конец эры империализма"
 SOV_the_end_of_the_imperialist_era_desc:0 "Возможно, самое открытое проявление империализма лежит в так называемой доктрине Монро, в которой одна-единственная страна объявляет своей эксклюзивной территорией целый континент. Такого быть не должно. На Американском континенте появится революционный плацдарм, и рабочие западного полушария наконец-то вздохнут свободно."
 SOV_the_need_for_policy_changes:0 "Менять политику не нужно"
 SOV_the_need_for_policy_changes_desc:0 "Сейчас со всей очевидностью ясно, что страна движется в неверном направлении. Сталин и его союзники пробовали слишком многое и слишком быстро. Прежде чем бегать, нужно научиться ходить. Нам надо вернуть товарища Сокольникова, который проделал большую работу в первые годы Советского Союза. Он поможет стране встать на нужные рельсы."
 SOV_reverse_the_collectivization_process:0 "Отмена процесса коллективизации"
 SOV_reverse_the_collectivization_process_desc:0 "Коллективизация стала настоящей катастрофой, породившей нищету и голод в районах, бывших житницей нашей страны. Ее нужно срочно отменить."
 SOV_organize_uprisings_in_the_country:0 "Организовать восстания в стране"
 SOV_organize_uprisings_in_the_country_desc:0 "Очевидно, что мы не сможем лишить Сталина власти без вооруженного восстания. Если отвлечь внимание тирана от нашей подготовки, восстания пройдут без всяких препон."
 SOV_dissent_in_the_party:0 "Раскол в партии"
 SOV_dissent_in_the_party_desc:0 "Мы должны теснить Сталина на нескольких фронтах, чтобы подорвать его власть над партией — в том числе публиковать в партийных газетах критические статьи и доклады с требованиями реформ и разбором его неудачных решений. Так мы и насолим Сталину, и закрепим свой авторитет у различных оппозиционных групп."
 SOV_eliminate_the_left:0 "Искоренить левых"
 SOV_eliminate_the_left_desc:0 "Хотя главный наш соперник — Сталин, мы должны признать, что в партии много тех, кто просто тянет время и подрывает наши усилия по захвату контроля над страной своими бесконечными дебатами. Теперь, когда Сталин начинает все сильнее подозревать нас, нам выпала возможность убить двух зайцев одним махом."
 SOV_concessions_to_foreign_powers:0 "Уступки иностранным державам"
 SOV_concessions_to_foreign_powers_desc:0 "Необходимость умолять иностранные государства о помощи в борьбе за страну глубоко унизительна, но сталинская тирания и паранойя не оставляют нам выбора."
 SOV_covert_support_for_spanish_poum:0 "Тайная поддержка испанской РПМЕ"
 SOV_covert_support_for_spanish_poum_desc:0 "В Испании вовсю идет контрреволюция. Фашисты и реакционеры поддерживают испанских националистов. Испанским республиканцам хватает рвения, но оно, к сожалению, не заменит оружия и боеприпасов, а также продуманной политической повестки. Мы можем предоставить им все это."
 SOV_undermine_stalins_authority:0 "Подорвать власть Сталина"
 SOV_undermine_stalins_authority_desc:0 "Сталин держится у власти лишь потому, что народ боится его и того, что он может сделать. Мы пока не можем избавить народ от страха, но можем снизить возможность Сталина вредить другим. Если все пройдет хорошо, мы, возможно, даже сможем изолировать его и лишить поддержки."
 SOV_clandestine_cells:0 "Тайные ячейки"
 SOV_clandestine_cells_desc:0 "Сталинистам повсюду мерещатся вредители, шпионы и саботажники. Они так долго обвиняли в этом других, что народ по большей части им уже не верит. Мы можем воспользоваться этим, чтобы организовать в крупных промышленных предприятиях свои ячейки и устраивать там саботаж, если Сталин будет противиться нашему захвату власти."
 SOV_the_plan_for_the_coup:0 "Планы на переворот"
 SOV_the_plan_for_the_coup_desc:0 "Эта борьба за власть не обязана перерастать в открытое насилие. Если мы разыграем все правильно и поставим нужных людей на правильные позиции, мы, возможно, сумеем лишить Сталина власти и выдавить его с занимаемого поста."
 SOV_the_socialist_bulwark:0 "Оплот социализма"
 SOV_the_socialist_bulwark_desc:0 "Мы стоим бок о бок с нашими испанскими товарищами, являя собой пример интернациональной солидарности. Их борьба — наша борьба, и наоборот. Вместе мы образуем социалистические революционные центры на противоположных концах Европы."
 SOV_coup_detat:0 "Государственный переворот"
 SOV_coup_detat_desc:0 "Пришло время взять на себя управление страной. Если все пройдет хорошо, мы ударим быстро и устраним главные препятствия, организовав бескровный переворот. Если же все пройдет плохо, нам нужно будет сражаться за свою страну."
 SOV_right_purges:0 "Враги государства"
 SOV_right_purges_desc:0 "Многие члены партии до сих пор не полностью приняли наше правление. Мы должны наказать их в назидание другим."
 SOV_the_power_of_the_peasantry:0 "Сила крестьянства"
 SOV_the_power_of_the_peasantry_desc:0 "Ортодоксальный марксизм приписывает революционный потенциал индустриальным рабочим, но очевидно, что в нашей стране основную революционную массу составляют крестьяне. Мы должны обучить миллионы фермеров и пробудить в них классовое сознание, чтобы они были готовы защищать революцию, когда она будет в опасности."
 SOV_curtailment_of_the_collective_farms:0 "Сокращение колхозов"
 SOV_curtailment_of_the_collective_farms_desc:0 "Огромные колхозы — типичный случай бюрократического сталинского гигантизма. Они отчуждают крестьянина от результата его труда и фактически превращают его в рабочего, но на поле. В то же время урожайность резко сократилась, и нарушение распределения провизии уже привело к катастрофе. Нам срочно нужно исправить эту ошибку."
 SOV_administrative_reforms:0 "Административные реформы"
 SOV_administrative_reforms_desc:0 "Сталин ценил лояльность превыше всего. Из-за этого наши управленцы не выказывают достаточно инициативы и независимого мышления, опасаясь, что это навлечет на них неприятности. Нам нужно привить им такие стремления — либо заменить их теми, у кого они уже есть."
 SOV_a_new_theory_of_revolution:0 "Новая теория революции"
 SOV_a_new_theory_of_revolution_desc:0 "Марксистская теория была состоятельна в XIX столетии, но реалии XX века требуют ее пересмотра. Революция не всегда начинается в самой развитой стране, и потому мы должны пересмотреть свой подход."
 SOV_back_to_the_nep:0 "Возвращение к НЭП"
 SOV_back_to_the_nep_desc:0 "Прежде чем мы сможем построить социалистическое общество, мы должны заложить основы экономики и развивать ее. В первые годы революции мы задействовали т. н. новую экономическую политику, которая стимулировала экономику механизмами свободного рынка. Эта политика была быстро отменена — раньше, чем она смогла дать свои плоды. Теперь, когда мы снова у власти, мы сможем перезапустить отмененный процесс и сделать жизнь народа лучше."
 SOV_planned_economy:0 "Плановая экономика"
 SOV_planned_economy_desc:0 "В НЭП хватало огрехов, но были, очевидно, и свои успехи. Мы по-прежнему далеки от того, чтобы построить полностью социалистическое общество, но теперь мы можем переводить свою экономику на плановые рельсы. В частности, мы должны разработать экономическую политику, которая учитывает способности наших партнеров и союзников и создает более взаимозависимую экономику."
 SOV_paced_industrialization:0 "Размеренная индустриализация"
 SOV_paced_industrialization_desc:0 "Зацикленность Сталина на тяжелой промышленности привела к значительному отставанию во многих секторах экономики, но игнорировать этот сектор в своем планировании мы не можем. Чтобы сделать возможной модернизацию и механизацию других секторов, мы должны выстроить промышленную базу."
 SOV_the_trade_union_as_labor_organizer:0 "Профсоюз как организатор труда"
 SOV_the_trade_union_as_labor_organizer_desc:0 "При капитализме профсоюзы существовали, чтобы гарантировать рабочим соблюдение прав человека и защищать их от эксплуатации со стороны фабрикантов. В новой системе этого, очевидно, не требуется, а следовательно, роль профсоюзов должна сместиться к организации труда ради оптимизации производства."
 SOV_incorporate_local_organizations:0 "Задействовать местные организации"
 SOV_incorporate_local_organizations_desc:0 "Местные организации часто лучше понимают проблемы рабочих, чем столичные. Нужно уменьшить значимость министров и других старших членов партии и дать больше власти организациям на местах."
 SOV_for_the_common_good:0 "Ради общего блага"
 SOV_for_the_common_good_desc:0 "Основным принципом любых решений, принимаемых нашими союзниками, должно быть по возможности большее благо. Даже если сперва жертвы не оправдываются немедленным улучшением, нужно четко дать понять всем, что в долгосрочной перспективе они окупятся по максимуму."
 SOV_victory_over_devastation:0 "Победа важнее разрушения"
 SOV_victory_over_devastation_desc:0 "Коллективные усилия нашего народа позволили нам преодолеть разруху гражданской войны. Скорость, с которой восстановилась страна, всегда будет служить монументом мастерству и преданности наших рабочих."
 SOV_socialist_humanism:0 "Социалистический гуманизм"
 SOV_socialist_humanism_desc:0 "Некоторые теоретики марксизма полагают, что люди никак не решают свою судьбу и что их жизни полностью определяются материальными факторами. Такой подход очевидно неверен и отражает буржуазное мировоззрение на рабочий класс. Люди — это больше чем просто набор органов, и относиться к ним следует соответственно."
 SOV_international_revolutionary_marxist_centre:0 "Интернациональный революционный марксизм"
 SOV_international_revolutionary_marxist_centre_desc:0 "Третий интернационал пал жертвой сталинского тоталитаризма, и его, вероятно, уже не спасти. Надо предложить компартиям мира новый способ координации и сотрудничества."
 SOV_a_sustainable_economy:0 "Самостоятельная экономика"
 SOV_a_sustainable_economy_desc:0 "Переход к новой экономической политике ознаменовался заметным сдвигом к производству потребительских товаров за счет снижения общих темпов индустриализации. Чтобы сохранить конкурентоспособность в долгосрочной перспективе, нужно перевести экономику на более рациональную модель."
 SOV_the_enemies_of_the_people:0 "Враги народа"
 SOV_the_enemies_of_the_people_desc:0 "Реакционеры по-прежнему в деле, они строят планы и ждут того дня, когда смогут уничтожить все достигнутое нами. Мы с союзниками должны всегда помнить об этой угрозе и знать, что рано или поздно нам придется сражаться, чтобы защитить революцию."
 SOV_proclaim_soviet_hegemony:0 "Провозгласить советскую гегемонию"
 SOV_proclaim_soviet_hegemony_desc:0 "Очевидно, что советские система управления, экономика и общество значительно превосходят во всем все прошлые системы. Эти устаревшие системы сохраняются в других странах, но всегда найдутся люди, готовые бросить им вызов. Такой готовностью стоит воспользоваться."
 SOV_military_support:0 "Военная поддержка"
 SOV_military_support_desc:0 "Возможность заручиться поддержкой вооруженных сил очень ценна. Даже если в результате информаторы Сталина узнают о нашем заговоре, будем надеяться, что отреагировать он к тому моменту уже не успеет."
 SOV_divert_attention_towards_military:0 "Перенаправить внимание на армию"
 SOV_divert_attention_towards_military_desc:0 "Если Сталин поверит, что армия недовольна им, он нападет не на нас, а на нее. В конце концов, армия ведь и правда им недовольна..."
 SOV_gain_support_from_party_members:0 "Получить поддержку членов партии"
 SOV_gain_support_from_party_members_desc:0 "Некоторые выступают марионетками Сталина исключительно из страха перед ним. Надо убедить их, что наш план увенчается успехом и они смогут стать героями без особых стараний. Есть способы..."
 SOV_sway_the_railway_workers:0 "Склонить на свою сторону железнодорожных рабочих"
 SOV_sway_the_railway_workers_desc:0 "Революции нужны припасы. Мы должны склонить железнодорожных рабочих на свою сторону. Это даст нам возможность подготовиться и скрыть свои склады вокруг операционной базы."
 SOV_infiltrate_the_nkvd:0 "Внедриться в НКВД"
 SOV_infiltrate_the_nkvd_desc:0 "Рядовые сотрудники НКВД выполняют грязную работу Сталина и часто ведут себя как его верные слуги, но даже в стене есть трещины. Мы сделаем так, чтобы как можно больше таких сотрудников начало работать на нас и скармливать тирану дезинформацию."
 SOV_cooperation_against_stalin:0 "Сотрудничество против Сталина"
 SOV_cooperation_against_stalin_desc:0 "Несмотря на все наши разногласия, на этом этапе борьбы мы должны объединиться против Сталина."
 SOV_align_the_zinovyevites:0 "Привлечь на свою сторону зиновьевцев"
 SOV_align_the_zinovyevites_desc:0 "$SOV_grigory_zinovyev$ однажды объединился со Сталиным против Троцкого. Сразу после этого Сталин предал его и лишил всякой власти. $SOV_grigory_zinovyev$ этого не забыл, и если мы дадим ему возможность отомстить, он ею воспользуется."
 SOV_liberate_ryutin:0 "Освободить Рютина"
 SOV_liberate_ryutin_desc:0 "Товарищ Рютин всегда без колебаний указывал на ошибки и недоработки Сталина. Пожалуй и неудивительно, что Сталин решил наказать его в назидание другим. Нам надо воспользоваться своим влиянием и вывезти Рютина за границу, пока Сталин не будет свергнут, чтобы потом Рютин помог нам управлять страной."
 SOV_return_democracy_to_the_party:0 "Вернуть в партию демократию"
 SOV_return_democracy_to_the_party_desc:0 "В революции был момент, когда мы не могли отвлекаться на долгие дискуссии о том, какой путь — лучший. Времена изменились, и теперь пора дать рабочим обещанную демократию во всех аспектах жизни. Это также значит, что мы можем вернуть в партию тех, чья плодотворная критика некогда считалась саботажем."
 SOV_strengthen_the_trade_unions:0 "Усилить профсоюзы"
 SOV_strengthen_the_trade_unions_desc:0 "Под лидерством Сталина профсоюзы из инструмента представления рабочих интересов перед руководством превратились в инструмент, который руководство использует для управления рабочими. Пусть это одно из меньших прегрешений тирана, оно полностью извратило идею демократического самоуправления рабочих и фактически лишило их возможности пожать плоды революции."
 SOV_the_peoples_revolution:0 "Народная революция"
 SOV_the_peoples_revolution_desc:0 "Чтобы революция преуспела, она должна покрыть все аспекты общества. Лишь в том случае, когда весь народ считает себя частью и носителем революции, он сможет выдержать связанные с ней трудности."
 SOV_the_supreme_soviet:0 "Верховный Совет"
 SOV_the_supreme_soviet_desc:0 "Ситуация, когда один человек представляет целую страну, по природе своей недемократична и, следовательно, контрреволюционна. Мы отвергнем культ личности и объявим, что наш союз всегда будет представлен общей волей народа, собранной в Верховном Совете."
 SOV_addressing_internal_affairs:0 "Внутренние дела государства"
 SOV_addressing_internal_affairs_desc:0 "У революции все еще много врагов по всему миру, и миллионы рабочих еще только ждут своего освобождения, но мы не должны забывать и о своих многочисленных внутренних делах."
 SOV_nkvd_primacy:0 "Главенство НКВД"
 SOV_nkvd_primacy_desc:0 "Пока мы не будем знать точно, что со всеми врагам государства покончено, мы должны и дальше полагаться на НКВД в деле защиты революции."
 SOV_the_new_soviet_woman:0 "Новая советская женщина"
 SOV_the_new_soviet_woman_desc:0 "Политическая революция принесла свободу миллионам людей в нашем Союзе — и прежде всего миллионам женщин, которые больше не ограничены ролью матери и жены, а могут работать наравне с мужчинами."
 SOV_expand_the_agitprop:0 "Расширить агитпроп"
 SOV_expand_the_agitprop_desc:0 "Чтобы достучаться до миллионов рабочих со всех уголков Союза, мы должны говорить на их языке. Мы должны выдвигать простые и понятные аргументы, такие, которые останутся в памяти обычного гражданина. Мы должны расширить работу в этой области."
 SOV_positive_heroism:0 "Положительный героизм"
 SOV_positive_heroism_desc:0 "Хотя все достижения членов рабочего класса сразу становятся общими, мы вполне можем ставить в пример другим особо отличившихся индивидуумов."
 SOV_revive_the_stakhanovite_movement:0 "Возродить стахановское движение"
 SOV_revive_the_stakhanovite_movement_desc:0 "В капиталистических странах эксплуатация заставляет рабочих надрываться и производить все больше и больше для владельцев заводов. В нашей же стране такие рабочие, как Алексей Стаханов, сами делают все возможное и даже больше, поскольку знают, что каждый дополнительно уложенный кирпич, каждая дополнительно добытая тонна угля, каждая дополнительная заклепка помогают построить мир, в котором рабочие будут навсегда освобождены от эксплуатации."
 SOV_war_heroes:0 "Герои войны"
 SOV_war_heroes_desc:0 "Русский народ всегда умел и был готов проявлять особую отвагу в борьбе с иноземными захватчиками. Хоть в сражении с врагом мы и едины, стоит признать, что в нашей армии есть такие солдаты, которые, выполняя свой долг, отличились особо."
 SOV_collectivist_propaganda:0 "Пропаганда коллективизма"
 SOV_collectivist_propaganda_desc:0 "Немалые испытания, выпавшие на нашу долю, никогда не выпадают кому-то одному. Все они — наши общие, следовательно, и все наши достижения тоже общие."
 SOV_socialist_emulation:0 "Социализм и личный пример"
 SOV_socialist_emulation_desc:0 "В капиталистической системе рабочие должны состязаться один с другим, чтобы заработать себе на еду, в то время как владельцы фабрик богатеют от любых нововведений, предложенных этими рабочими. Это расточительно и негуманно. Социалистическая система позволит тем, кто пока еще не раскрыл свой потенциал полностью, получать от передовиков поддержку и знания и тем самым становиться лучше."
 SOV_socialist_realism:0 "Социалистический реализм"
 SOV_socialist_realism_desc:0 "Дорога к славному социалистическому будущему длинна и часто извилиста. Некоторые даже могут потерять надежду на то, что цели можно достичь. Мы должны показать им, ради чего они трудятся, а для этого надо развивать стиль искусства, в котором демонстрируется, какой будет жизнь в социалистической стране."
 SOV_the_komsomol:0 "Комсомол"
 SOV_the_komsomol_desc:0 "Мы не строим социализм для сегодняшних взрослых, мы строим его для детей и еще не рожденных поколений. Их нужно учить, как улучшать и развивать построенное нами, чтобы они могли завершить то, что начали мы. Нужно организовать особую молодежную ассоциацию, которая будет не только давать знания, но и учить быть хорошими коммунистами."
 SOV_patriarch_of_all_russia:0 "Патриарх Всея Руси"
 SOV_patriarch_of_all_russia_desc:0 "Хоть и не совсем правильно поддерживать темные суеверия в просветленном коммунистическом обществе, нельзя не признать, что в трудные времена многие нашли силу и утешение в своей вере. Создание нового общества тоже не обходится без трудностей, так что, возможно, нам стоит разрешить религиозным институтам действовать и дальше, при условии, что они останутся лояльны государству."
 SOV_development_aid_for_eastern_allies:0 "Помощь в развитии восточных союзников"
 SOV_development_aid_for_eastern_allies_desc:0 "Столетиями западные империалисты и колониалисты жестоко эксплуатировали страны Азии. Небольшие инвестиции с нашей стороны позволят нашим азиатским союзникам сопротивляться проникновению капитализма куда эффективнее."
 SOV_war_measures_in_the_east:0 "Меры военного времени на востоке"
 SOV_war_measures_in_the_east_desc:0 "Нет сомнения, что до Азии скоро дойдет мировая борьба с фашизмом и другими контрреволюционными идеологиями. Мы должны четко донести до своих союзников, что отчаянные времена требуют отчаянных мер."
 SOV_annex_tannu_tuva:0 "Annex Tannu Tuva"
 SOV_fortify_mongolian_border:0 "Укрепить монгольскую границу"
 SOV_fortify_mongolian_border_desc:0 "Поскольку японские радикалы сейчас присматриваются к Китаю, нельзя исключать возможности, что они пожелают расширить свои достижения, напав на нас. Мы должны убедиться, что наши монгольские союзники не станут прорехой в обороне."
 SOV_send_military_advisors_to_spain:0 "Отправить военных советников в Испанию"
 SOV_send_military_advisors_to_spain_desc:0 "Выиграв демократические выборы, наши товарищи в Испании столкнулись с реакционной контрреволюцией. Мы должны поддержать их, иначе их поражение вдохновит фашистов в других странах."
 SOV_policy_of_collective_security:0 "Политика коллективной безопасности"
 SOV_policy_of_collective_security_desc:0 "Несмотря на их капиталистическую и нередко реакционную природу, демократические правительства в Европе знают, что фашисты считают их слабыми и недоразвитыми. Если придет война, они падут первыми еще до того, как вся ярость фашизма обернется против родины революции. Те из политиков, кому хватает прозорливости признать это, должны знать, что в Москве их всегда готовы выслушать."
 SOV_anti_fascist_policies:0 "Антифашистская политика"
 SOV_anti_fascist_policies_desc:0 "Мирное сосуществование с фашистами невозможно. Мы должны обратиться ко всем союзникам, каких сможем найти, и готовиться к неизбежной конфронтации."
 SOV_seek_a_defense_pact_with_the_allies:0 "Оборонительный пакт с союзниками"
 SOV_seek_a_defense_pact_with_the_allies_desc:0 "Мы общались с западными демократиями в неформальной обстановке, но ни к каким конкретным и зафиксированным на бумаге соглашениям пока не пришли. Пора это исправить и объявить всему миру, что западные демократии хотят объединиться с нами в общий фронт борьбы с фашистской экспансией."
 SOV_the_khakimov_proposal:0 "Предложение Хакимова"
 SOV_the_khakimov_proposal_desc:0 "Хакимов неустанно трудился над улучшением наших отношений с [SAU.GetNameRuAcc]. Эксперты полагают, что этот регион чрезвычайно богат природными ресурсами, которые, без сомнения, захотят эксплуатировать капиталисты. Нам нужно и дальше укреплять взаимное доверие, чтобы уберечь государство [SAU.GetNameDef] от вступления в какой-либо враждебный блок и первыми получить права на разработку потенциальных ресурсов."
 SOV_eradicate_western_fascism:0 "Уничтожить западный фашизм"
 SOV_eradicate_western_fascism_desc:0 "Мы не можем ждать, пока фашистские режимы Западной Европы соизволят напасть на нас в удобный им момент. Лучший способ разделаться с фашизмом — бить первыми и бить сильно."
 SOV_policy_of_individual_security:0 "Политика индивидуальной безопасности"
 SOV_policy_of_individual_security_desc:0 "У нас мало друзей в этом мире и много врагов. Не стоит слишком задумываться над тем, с кем именно мы заключаем сделки — все равно либо они, либо мы нарушим условия договоров, как только те себя исчерпают."
 SOV_approach_germany:0 "Обратиться к Германии"
 SOV_approach_germany_desc:0 "Почему бы нам не прийти к компромиссу с Германией? Разумеется, вечно мирно сосуществовать с ней мы не сможем, но пока немцам грозят с тыла западные союзники, немцы не нападут на нас. Надо поощрить немцев начать именно с Запада."
 SOV_liberation_of_the_european_proletariat:0 "Освобождение европейского пролетариата"
 SOV_liberation_of_the_european_proletariat_desc:0 "Бесхребетные буржуазные правительства стран Западной Европы показали свое полное нежелание противостоять фашизму. Они не сыграют никакой роли в будущей большой борьбе фашизма и коммунизма. Рабочие этих стран притом готовы сражаться вместе с нами против фашистской чумы — нужно лишь дать им правительства, разделяющие эту готовность."
 SOV_anti_capitalist_policies:0 "Антикапиталистические политики"
 SOV_anti_capitalist_policies_desc:0 "Очевидно, что многие, если не все капиталистические страны удовлетворятся просто перенаправлением фашистов в другую сторону, когда те захотят расширить территорию. При наличии выбора буржуазия всегда будет угнетать пролетариат. В сущности, верить ей нельзя и нужно быть готовым к бою с ней."
 SOV_recover_alaska:0 "Вернуть Аляску"
 SOV_recover_alaska_desc:0 "Продав Аляску американцам, российское правительство предало собственный народ. Давно пора исправить это предательство и вернуть эту землю себе. Население Аляски будет куда счастливее жить в составе нашего Союза, чем в системе эксплуатации, в которой оно живет сейчас."
 SOV_the_fight_for_the_pacific:0 "Борьба за Тихий океан"
 SOV_the_fight_for_the_pacific_desc:0 "Как бы ни были мы сильны на суше, чтобы поквитаться с врагами в Тихоокеанском регионе, нам придется добираться туда по воде. Следовательно, мы должны разработать свою береговую инфраструктуру и кораблестроительную промышленность, прежде чем сможем эффективно вести войну в том регионе."
 SOV_baltic_security:0 "Безопасность на Прибалтике"
 SOV_baltic_security_desc:0 "Судьба стран, окружающих Балтийское море, тесно связана с нашей. Мы не можем допустить, чтобы у наших границ существовали враждебные нам правительства."
 SOV_respect_baltic_self_determination:0 "Уважать балтийское самоопределение"
 SOV_respect_baltic_self_determination_desc:0 "Все народы должны иметь возможность решать свои дела демократическим путем. Разумеется, во многих буржуазных демократиях Запада этот процесс извращен влиянием крупного капитала. Мы проследим, чтобы рабочие Эстонии, Латвии и Литвы были справедливо представлены в своих правительствах."
 SOV_claims_in_baltic:0 "Претензии на Прибалтику"
 SOV_claims_in_baltic_desc:0 "Балтийские государства некогда были неотделимой частью России. Их народам нужна защита большой страны, способной уберечь их от эксплуатации. Если же балтийские государства не согласятся на такую защиту, нам придется обеспечить ее насильно."
 SOV_secure_leningrad:0 "Защитить [195.GetName]"
 SOV_secure_leningrad_desc:0 "Сейчас наша граница с Финляндией слишком близко находится к региону [195.GetName]. Внезапная финская атака может за считанные часы дойти до наших городов, также очень легко может быть заблокирован наш Балтийский флот. Такое положение дел неприемлемо, и мы должны ясно дать понять это финскому правительству."
 SOV_control_scandinavia:0 "Контролировать Скандинавию"
 SOV_control_scandinavia_desc:0 "Последняя оставшаяся угроза нашей северной границе — правительства стран Скандинавского полуострова. Мы должны настоятельно донести до них тот факт, что мирное сосуществование требует взаимного доверия, а доверять правительствам, чья идеология не совпадает с нашей, мы не можем."
 SOV_claims_on_poland:0 "Претензии на Польшу"
 SOV_claims_on_poland_desc:0 "Польша держит у себя территории, которые столетиями принадлежали России. Украина и Беларусь из-за этого оказались разделены между нашими странами. Такое положение дел неприемлемо. Может, поляки и одолели нас в 1921 году, но им пора напомнить, что времена поменялись."
 SOV_demand_eastern_poland:0 "Потребовать Восточную Польшу"
 SOV_demand_eastern_poland_desc:0 "После Первой мировой войны была предложена и проведена линия Керзона, ставшая восточной границей Польши. Эта линия проходит примерно в 200 км к западу от текущей границы Польши. Надо напомнить полякам этот простой исторический факт и проследить, чтобы граница проходила там, где надо."
 SOV_offer_poland_protection:0 "Предложить Польше защиту"
 SOV_offer_poland_protection_desc:0 "За века Польша и польский народ претерпели много унижений и несправедливостей. Не секрет, что немцы хотят вернуть себе земли, отданные Польше после Первой мировой войны, и готовы прибегнуть для этого к насилию. Надо предложить польскому правительству свою защиту — если оно готово обсудить состояние наших общих границ."
 SOV_claim_on_bessarabia:0 "Претензии на Бессарабию"
 SOV_claim_on_bessarabia_desc:0 "В 1918 году румыны беззастенчиво воспользовались нашими внутренними проблемами и аннексировали Бессарабию. Пора напомнить им, что они удерживают территорию, по закону принадлежащую нам, и если Румыния не желает восстановить правильные границы, мы принудим ее к этому силой оружия."
 SOV_demand_balkan_submission:0 "Потребовать балканского подчинения"
 SOV_demand_balkan_submission_desc:0 "Прошлый опыт показал нам, что окружающие нас страны будут пользоваться любой выказанной нами слабостью. Сейчас, когда в Европе зреет война, мы не можем позволить себе соседей с сомнительной политической ориентацией. Страны Балкан и Малой Азии должны выбирать — либо они с нами, либо против нас."
 SOV_seek_balkan_cooperation:0 "Искать балканского сотрудничества"
 SOV_seek_balkan_cooperation_desc:0 "Страны Балканского полуострова и Малой Азии могут стать могущественными союзниками, если мы поможем им сблизить свою идеологию с нашей."
 SOV_middle_east_diplomacy:0 "Дипломатия Ближнего Востока"
 SOV_middle_east_diplomacy_desc:0 "У нас есть много возможностей улучшить свое положение на Аравийском полуострове и в Азии. Скоро будет сделан очередной ход в большой игре с британцами."
 SOV_the_southern_thrust:0 "Южный рывок"
 SOV_the_southern_thrust_desc:0 "Наша южная граница — настежь открытый для врагов фланг. Мы не можем это терпеть, как не можем и ждать мирных перемен в том регионе."
 SOV_support_afghan_ideology:0 "Помочь афганским [SOV.GetRulingIdeology_RU_lower_Adherent_Nom]ам"
 SOV_support_afghan_ideology_desc:0 "Афганистан — место, где терпят поражение самые гордые нации. Военная операция в такой стране в лучшем случае будет неоправданно дорогой, в худшем же — неэффективной. В Афганистане у нас есть знакомые, которые желают основать там правительство, идеологически близкое нашему. Стоит поддержать это начинание."
 SOV_preemptive_invasion_of_iran:0 "Опережающее вторжение в Иран"
 SOV_preemptive_invasion_of_iran_desc:0 "В случае войны не стоит рассчитывать, что [PER.GetNameDef] нас поддержит; нет и гарантий, что эта держава не вступит в войну на стороне наших врагов. В такой ситуации нужно не выжидать, а действовать на опережение."
 SOV_the_threat_from_the_land_of_the_rising_sun:0 "Угроза от Страны восходящего солнца"
 SOV_the_threat_from_the_land_of_the_rising_sun_desc:0 "Очевидно, что Япония хочет доминировать над Китаем, а потом пойти на север и прибрать к рукам обширные ресурсы Сибири. Пока японцы будут заняты в Китае, они не осмелятся воевать с нами, и потому следует сделать все, чтобы война в Китае затянулась до тех пор, пока мы не будем готовы противостоять японцам."
 SOV_the_gobi_gambit:0 "Гобийский гамбит"
 SOV_the_gobi_gambit_desc:0 "Пока между Японией и Китаем разгорается конфликт, у нас есть возможность захватить окрестности пустыни Гоби. Так мы обеспечим себе влияние на будущее Китая и место за столом переговоров."
 SOV_two_red_flags:0 "Два красных флага"
 SOV_two_red_flags_desc:0 "Революция пока не достигла в Китае особого успеха, но это и не удивительно. В стране пока еще нет индустриального общества, необходимого для социалистической революции. Тем не менее лучшие шансы достичь коммунистического будущего для китайского народа дает коммунистическая партия."
 SOV_support_the_kuomintang:0 "Поддержать Гоминьдан"
 SOV_support_the_kuomintang_desc:0 "Китайские коммунисты слабы в военном плане и не имеют индустриальной базы для создания крупной армии. Очевидно, что Гоминьдан лучше подходит для управления Китаем. Эта партия создаст там буржуазное общество — необходимую предпосылку успешной коммунистической революции."
 SOV_intervention_in_china:0 "Интервенция в Китай"
 SOV_intervention_in_china_desc:0 "Ситуация в Китае дошла до той точки, когда она начинает угрожать нашей безопасности. Мы должны вмешаться и внедрить там другое, надежное правительство."
 SOV_prepare_a_war_with_japan:0 "Подготовка к войне с Японией"
 SOV_prepare_a_war_with_japan_desc:0 "Прежде чем мы атакуем Японию, надо усилить разведку, чтобы не нарваться там на неприятные сюрпризы."
 SOV_end_the_khalkhin_gol_conflict:0 "Завершить конфликт на Халхин-Голе"
 SOV_end_the_khalkhin_gol_conflict_desc:0 "Пограничный конфликт с Японией продолжается уже довольно долго. Если мы не можем добиться от японского правительства соблюдения установленных границ, нам придется сместить это правительство."
 SOV_recover_the_kuril_islands:0 "Вернуть Курильские острова"
 SOV_recover_the_kuril_islands_desc:0 "Мы утратили Курильские острова после катастрофы 1905 года. Нанеся быстрый и решительный удар, мы можем вернуть их себе и показать Японии, что раздувать конфликт ей будет невыгодно."
 SOV_reconcile_japan:0 "Примириться с Японией"
 SOV_reconcile_japan_desc:0 "Основная угроза нам будет исходить из Европы. Нужно разобраться со всеми текущими проблемами с Японией, чтобы затем сосредоточиться на западных границах и не бояться удара в спину."
 SOV_spheres_of_influence_in_china:0 "Сферы влияния в Китае"
 SOV_spheres_of_influence_in_china_desc:0 "Последний оставшийся между нами камень преткновения — ситуация в Китае. Нас этот регион интересует не сильно, и если мы можем купить японскую поддержку соглашением о сферах интересов, это нужно сделать без колебания."
 SOV_soviet_japanese_pact_against_usa_focus:0 "Советско-японский пакт против США"
 SOV_soviet_japanese_pact_against_usa_focus_desc:0 "Для подпитки своей растущей экономики японцам нужна дальнейшая экспансия. В наших интересах направить ее как можно дальше от нас, заручившись заодно поддержкой сильной морской державы. Вместе мы можем убрать Соединенные Штаты с мировой арены!"
 SOV_beaten_but_not_defeated:0 "Сокрушены, но не побеждены"
 SOV_beaten_but_not_defeated_desc:0 "Очевидно, что коммунисты повели нашу некогда гордую страну по опасному пути. Рано или поздно все наши соседи почувствуют присущую режиму слабость и атакуют. Если мы хотим спасти свою любимую родину, надо убрать коммунистов из власти!"
 SOV_unification_of_the_exiles:0 "Объединение изгнанников"
 SOV_unification_of_the_exiles_desc:0 "После революции и гражданской войны многие люди предпочли изгнание так называемой справедливости нового режима. Они по-прежнему где-то там и мечтают о дне, когда Россия опять станет свободной. Как именно будет выглядеть политическая система свободной России, для них не так важно. Прежде чем мы сможем создать правительство, нужное стране, мы должны взять власть, и это лучше делать сообща."
 SOV_womens_fascist_movement:0 "Женское фашистское движение"
 SOV_womens_fascist_movement_desc:0 "Роль женщины, разумеется, в том, чтобы обеспечить своему мужу уютный дом, в котором можно отдыхать, и семью, за которую стоит сражаться, но многие мужчины уже забыли о своем долге стране и народу. Возможно, несколько целеустремленных женщин могли бы сообща напомнить мужьям, что сейчас стоит на кону, и поощрить их сделать то, что нужно."
 SOV_the_true_tsars:0 "Истинные цари"
 SOV_the_true_tsars_desc:0 "Русскому народу всегда требовался сильный лидер, иначе люди все сильнее и сильнее погружались в омут беззакония, пока брат не начинал идти против брата, а сын против отца. Цари прежних времен, однако, плохо годились на свою роль — они были слабы и нерешительны. В будущем нам понадобится царь, который сможет достойно нести свое тяжелое бремя."
 SOV_national_unification:0 "Национальное объединение"
 SOV_national_unification_desc:0 "Чтобы выжить в грядущих войнах, нам необходимо оставаться едиными. Каковы бы ни были наши политические разногласия, в конечном итоге мы все — русские."
 SOV_embrace_the_black_hundreds:0 "Возродить черные сотни"
 SOV_embrace_the_black_hundreds_desc:0 "В прежние времена, до хаоса Революции, у нас были люди, которые верили. Они верили в сильную Россию, объединенную Россию, Россию, которая не боится быть собой. Их называли черными сотнями. Выжившие черносотенцы теперь рассеяны по многим странам, но их вера по-прежнему сильна. Мы можем найти их и вернуть к себе."
 SOV_covert_operations:0 "Тайные операции"
 SOV_covert_operations_desc:0 "Коммунисты подвержены недоверию и разногласиям. Если правильно сыграть на этом, можно натравить их друг на друга."
 SOV_muster_the_old_guard:0 "Собрать старую гвардию"
 SOV_muster_the_old_guard_desc:0 "До сих пор еще живы многие из тех, кто когда-то сражался за царя и отечество. Они состарились и стали мягче, но настоящий военный опыт бесценен. Достучавшись до них, мы могли бы собрать из них опытный костяк новой армии, чтобы с ее помощью потом вернуть себе страну."
 SOV_approach_semyonov:0 "Обратиться к Семенову"
 SOV_approach_semyonov_desc:0 "$SOV_grigory_semyonov$ занял пост советника в государстве [MAN.GetName]. Теперь, когда наша сила крепнет с каждым часом, мы можем убедить его вернуться. Первой его задачей станет организация большого кавалерийского войска для новой Российской империи."
 SOV_fascist_youth_union:0 "Фашистский союз молодежи"
 SOV_fascist_youth_union_desc:0 "Вместо того чтобы смотреть в прошлое, нам стоит глядеть в будущее, навстречу молодым и современным технологиям. Юные фашисты горят идеей вернуть России былую славу. Недостаток опыта они с лихвой восполняют рвением."
 SOV_tolkachi:0 "Толкачи"
 SOV_tolkachi_desc:0 "В советской экономике существует определенный тип людей, чья задача — следить за тем, чтобы показатели в производственном плане совпадали с показателями, которые способна дать индустрия. Если мы убедим таких людей работать на нас, мы можем дать Советам одно число, директорам заводов другое число, а произведенную разницу между ними хранить отдельно до нужных времен."
 SOV_south_manchuria_railway:0 "Южно-Маньчжурская железная дорога"
 SOV_south_manchuria_railway_desc:0 "Компания «Южно-Маньчжурская железная дорога» — отдельное государство в государстве [MAN.GetName]. С ее поддержкой мы сможем подготовить сеть снабжения, необходимую в будущей борьбе."
 SOV_organize_wreckers:0 "Организовать вредительство"
 SOV_organize_wreckers_desc:0 "Советы повсюду ожидают саботажников и классовых врагов. Драконовские меры охраны даже на самом крошечном сталелитейном заводе уже раздражают рабочих, и мы легко найдем тех, кто захочет поквитаться с местными тиранами заводского масштаба, если дать им такую возможность."
 SOV_the_eyes_fear:0 "Глаза боятся..."
 SOV_the_eyes_fear_desc:0 "Перед нами поставлена непростая задача. Мы должны противостоять правительству, у которого были десятилетия на укрепление своих позиций и которое поддержит значительная доля населения. Но мы знаем, что нужно делать, — осталось только начать."
 SOV_the_hands_do:0 "...А руки делают"
 SOV_the_hands_do_desc:0 "Час пробил. Мы должны приступить к выполнению священной задачи: избавить Родину от советской системы правления, чтобы наши дети однажды смогли быть свободными от призрака коммунизма."
 SOV_call_for_aid:0 "Зов о помощи"
 SOV_call_for_aid_desc:0 "Борьба с коммунизмом в России — часть большой борьбы с коммунизмом повсюду, но именно победа над ним в нашей стране станет смертельным ударом по мировому коммунистическому движению, и потому многие страны будут готовы помочь нам."
 SOV_request_imperial_protection:0 "Запросить имперской защиты"
 SOV_request_imperial_protection_desc:0 "Отчаянные времена требуют отчаянных мер. Если победить коммунизм можно, лишь поклонившись Хирохито, то так тому и быть. Придет время, когда Россия сама станет империей, но пока что нам нужна помощь другой империи."
 SOV_sabotage_behind_enemy_lines:0 "Диверсии в тылу врага"
 SOV_sabotage_behind_enemy_lines_desc:0 "Десятилетия неумелого коммунистического управления привели к тому, что народ в массе обозлился и разочаровался в правительстве. Там, где коммунисты еще цепляются за власть, мы можем воспользоваться оппозицией, чтобы ускорить их поражение."
 SOV_aristocratic_investments:0 "Аристократические инвестиции"
 SOV_aristocratic_investments_desc:0 "Много бывших российских аристократов по сей день разбросаны по миру, и немало из них по-прежнему обладают значительными богатствами. Часть этих богатств можно направить нам на покупку оружия и снаряжения."
 SOV_consolidate_power:0 "Объединить власть"
 SOV_consolidate_power_desc:0 "Война, разрывавшая нашу нацию на части, выиграна. Мы должны усилить свои позиции и методично устранять тех, кто осмелился пойти против нас."
 SOV_rebuild_the_nation:0 "Возродить нацию"
 SOV_rebuild_the_nation_desc:0 "Страну, опустошенную войной, теперь надо восстанавливать. Пропагандистскими кампаниями мы добьемся того, что каждые мужчина, женщина и ребенок будут вносить свой вклад в дело восстановления."
 SOV_bringing_breakaways_back_to_the_fold:0 "Вернуть отколовшихся обратно"
 SOV_bringing_breakaways_back_to_the_fold_desc:0 "Теперь, когда мы отвоевали большую часть страны, нужно разобраться с теми, кто откололся. Не ждали же они, что мы так просто смиримся с потерей территории Российской империи?"
 SOV_offer_autonomy_to_former_soviet_republics:0 "Предложить автономию бывшим советским республикам"
 SOV_offer_autonomy_to_former_soviet_republics_desc:0 "Чтобы достичь своих целей, нам пришлось смирится с потерей части имперских территорий, но все должны понимать, что эти земли — сфера интересов Российской империи. Впрочем, эти регионы помогли нам отвоевать империю, и потому мы должны в благодарность предложить им определенную автономию."
 SOV_restore_the_glory_of_the_motherland:0 "Восстановить славу Родины"
 SOV_restore_the_glory_of_the_motherland_desc:0 "Мы сделаем все, чтобы под нашей новой властью Россия стала славной как никогда! Мы запустим большие стройки и сделаем нашу страну примером для западного мира!"
 SOV_article_124:0 "Статья 124"
 SOV_article_124_desc:0 "[SOV.GetArticle124Desc]"
 SOV_reopen_novodevichi:0 "Открыть Новодевичий монастырь"
 SOV_reopen_novodevichi_desc:0 "Церковь долго была лишена возможности обучать новых священников. Чтобы оживить ее, нам нужно место, где она сможет готовить духовенство и монахов. Очевидным вариантом для такого места нам представляется старый Новодевичий монастырь."
 SOV_rebuild_the_savior_cathedral:0 "Восстановить храм Христа Спасителя"
 SOV_rebuild_the_savior_cathedral_desc:0 "[SOV.GetRebuildtheSaviorCathedralDesc]"
 SOV_the_synod:0 "Синод"
 SOV_the_synod_desc:0 "Теперь, когда снова работает семинария в Новодевичьем монастыре, нам нужно провести Синод, чтобы церковь могла решить, как поменялись ее дела с тех пор, когда ей в последний раз разрешали проводить такое собрание."
 SOV_the_declaration:0 "Декларация"
 SOV_the_declaration_desc:0 "[SOV.GetTheDeclarationDesc]"
 SOV_return_of_the_rocor:0 "Возвращение РПЦЗ"
 SOV_return_of_the_rocor_desc:0 "Русская православная церковь за границей состоит из тех изгнанников, которые вместо того, чтобы отречься от своей веры и принципов, решили покинуть страну после гражданской войны. Теперь, когда коммунистическое правительство, вынудившее их уйти в изгнание, побеждено, настало время поприветствовать их дома и восстановить в санах."
 SOV_reformalize_the_role_of_the_patriarchate:0 "Реформировать роль патриархата"
 SOV_reformalize_the_role_of_the_patriarchate_desc:0 "[SOV.GetReformalizetheRoleofthePatriarchateDesc]"
 SOV_reconvene_the_zemsky_sobor:0 "Заново созвать Земский собор"
 SOV_reconvene_the_zemsky_sobor_desc:0 "В прошлом российский народ собирал своего рода парламент, т. н. Земский собор, на котором обсуждались различные дела и решались проблемы. Пока мы не определили, какой курс должна взять наша страна, стоит дать людям возможность решать самые насущные вопросы."
 SOV_dismantle_the_zemsky_sobor:0 "Распустить Земский собор"
 SOV_dismantle_the_zemsky_sobor_desc:0 "Земский собор изжил себя. Избыток демократии может быть вреден, как показал нам 1917 год. Не стоит повторять ошибок прошлого."
 SOV_russian_corporate_state:0 "Российское корпоративное государство"
 SOV_russian_corporate_state_desc:0 "Будущее России лежит не в классовом конфликте, а, скорее, в классовом сотрудничестве. Для этого государство создаст национальные профсоюзы, которые будут примирять интересы труда и капитала и таким образом регулировать производство."
 SOV_romanov_reconstruction:0 "Возрождение Романовых"
 SOV_romanov_reconstruction_desc:0 "Наконец-то во главе нашей нации снова стоит царь. Через два десятилетия после казни последних законных правителей нашей страны пришло время снова вернуть себе правящую династию и устранить последние препятствия к выполнению монаршей воли."
 SOV_capital_of_the_tsars:0 "Столица царей"
 SOV_capital_of_the_tsars_desc:0 "Санкт-Петербург долгое время был столицей нашей гордой нации. Теперь, когда в Зимнем дворце снова заседает Романов, пора вернуть официальную столицу в этот великолепный город и приложить все усилия к его возвышению."
 SOV_church_candidates:0 "[SOV.GetChurchCandidatesName]"
 SOV_church_candidates_desc:0 "[SOV.GetChurchCandidatesDesc]"
 SOV_reinstitute_the_mestnichestvo:0 "Возродить институт местничества"
 SOV_reinstitute_the_mestnichestvo_desc:0 "В прежние дни дела государства вели самые старые и прославленные семьи. Это гарантировало верность элиты государству и воспитание каждого нового поколения по стандартам предыдущего. Нужно возродить эту систему в нашем новом режиме."
 SOV_the_iron_wall_of_russian_resolve:0 "Стальная стена российской решимости"
 SOV_the_iron_wall_of_russian_resolve_desc:0 "Царь грезит об огромных боевых орудиях, больше любых существующих танков, не имеющих себе равных на поле боя. Русский народ непокорен и непокорим! Такие машины станут воплощением русской решимости, они сокрушат любую армию, что решит на нас напасть."
 SOV_my_brothers_keeper:0 "Сторож брату моему"
 SOV_my_brothers_keeper_desc:0 "Старая династия Романовых связана узами со множеством благородных семей. Какие-то из этих семей до сих пор у власти, какие-то уже утратили свой трон. Теперь, когда мы восстановили свою монархию, нужно сделать все, чтобы и в других странах к власти пришли те, кто имеет на это право."
 SOV_the_rightful_heir_to_the_empire:0 "Законный наследник империи"
 SOV_the_rightful_heir_to_the_empire_desc:0 "Хотя старой Византийской империи уже давно нет, кто-то по-прежнему должен защищать паломников на Святую землю. Очевидно, что британцы и французы с этой задачей не справятся. Остаемся мы."
 SOV_the_third_rome:0 "Третий Рим"
 SOV_the_third_rome_desc:0 "Теперь, утвердившись в роли защитников святых мест, мы, без сомнения, стали и защитниками веры. Будет только правильно утвердить себе соответствующее название. Нет никакого сомнения, что после падения Константинополя Москва стала настоящим Третьим Римом."
 SOV_vengeance_for_the_yoke:0 "Месть за иго"
 SOV_vengeance_for_the_yoke_desc:0 "Много веков назад монголы огнем и мечом прошлись по русским землям. Они и по сей день единственные, кому удавалось завоевать Россию. Сейчас они кажутся слабыми, но мы должны сделать все, чтобы они не обрели прежнюю силу и наша страна никогда больше не познала ига."
 SOV_reclaim_uryankhay_krai:0 "Возвращение Урянхайского края"
 SOV_reclaim_uryankhay_krai_desc:0 "После Китайской революции 1911 года Внешняя Монголия отделилась от империи Цин, а тувинские нойоны обратились к Российской империи с просьбой включить в ее состав Урянхайский край. Мы решили их защитить, сделав этот край [ROOT.GetAdjective]ой территорией. Однако после недавних потрясений гражданской войны они, похоже, стремятся от нас отделиться. Мы не должны давать им независимость, иначе мировые державы будут смотреть на нас свысока еще много столетий!"
 SOV_westward_bound:0 "Расширение на запад"
 SOV_westward_bound_desc:0 "Большинство наших западных владений было утеряно с распадом империи после революции. Пришло время нарастить инфраструктуру и готовиться вернуть себе то, что наше по праву."
 SOV_the_triple_entente:0 "Возродить Тройственную Антанту"
 SOV_the_triple_entente_desc:0 "Наших старых врагов в Центральной Европе нужно сдерживать. Некогда существовал альянс, созданный специально для этой цели, но с нашим постыдным выходом из Великой войны он распался. Пришло время его возродить."
 SOV_our_slavic_commitments:0 "Наша преданность всему славянскому"
 SOV_our_slavic_commitments_desc:0 "Мы некогда были защитниками всех славян и даже вступили в Великую войну, чтобы защитить наших более слабых славянских братьев. Пора нам снова вспомнить об этом долге и предоставить им свою военную мощь."
 SOV_the_old_enemy:0 "Старый враг"
 SOV_the_old_enemy_desc:0 "Швеция годами была занозой в боку Империи. Вновь и вновь она нападала на Россию и пыталась создавать враждебные нам коалиции. Впервые ответный удар ей нанес царь Петр I, побив шведов под Полтавой. В 1809 году мы снова победили их — и тут им, казалось бы, следовало понять свое место. Шведы, однако же, продолжили оспаривать наши интересы в Балтийском регионе. Пора раздавить эту крохотную нацию раз и навсегда."
 SOV_secure_finland:0 "Захватить Финляндию"
 SOV_secure_finland_desc:0 "Великое княжество Финляндское больше века охраняло наши северные границы, пока не откололось от нас в ходе гражданской войны. Пришло время воссоединить Финляндию с родиной."
 SOV_secure_the_baltics:0 "Захватить Балтику"
 SOV_secure_the_baltics_desc:0 "Балтийский регион долгое время был неотъемлемой частью России. Он откололся от нас в момент национальной слабости и должен быть как можно скорее присоединен обратно."
 SOV_panslavic_nationalism:0 "Панславянский национализм"
 SOV_panslavic_nationalism_desc:0 "Россия всегда была старшим братом в нашей славянской семье. За долгое время мы твердо усвоили одно: славян всегда будут атаковать, притеснять и унижать, если мы не станем держаться вместе."
 SOV_the_fate_of_romania:0 "Судьба Румынии"
 SOV_the_fate_of_romania_desc:0 "Румыния обладает значительным славянским меньшинством и блокирует нам наземный доступ к славянским народам на Балканах. Чтобы решить обе эти проблемы одним махом, нужно покончить с румынской независимостью — если понадобится, то и силой оружия."
 SOV_pacify_the_rim:0 "Усмирить рубежи"
 SOV_pacify_the_rim_desc:0 "Мы не можем допустить повторения войны 1905 года, когда враг атаковал наши дальневосточные владения, к чему те оказались совершенно не готовы. Мы должны вложиться в местную инфраструктуру, чтобы при необходимости можно было быстро перемещать войска."
 SOV_eastern_expansion:0 "Экспансия на восток"
 SOV_eastern_expansion_desc:0 "Будущее России лежит на востоке. После того, как мы усмирили Сибирь, будет только естественно заполучить там еще больше земель и ресурсов."
 SOV_intervention_in_the_americas:0 "Вторжение в Америку"
 SOV_intervention_in_the_americas_desc:0 "Беда многих малых наций Карибского бассейна и Латинской Америки — нестабильные правительства. Нам пора поиграть политическими мускулами и «поощрить» развитие их внутренней политики в сторону силы и стабильности. Когда у них появятся администрации, идущие схожим с нашим курсом, мы предложим им места в нашем растущем военном альянсе."
 SOV_restore_the_old_eastern_empire:0 "Восстановить старую Восточную империю"
 SOV_restore_the_old_eastern_empire_desc:0 "Было время, когда наша славная империя тянулась до Тихого океана и заходила на Американский континент. В свое время из-за необдуманного решения те земли были проданы ради сиюминутной материальной выгоды, но под нашим правлением Россия может снова вернуть себе американские владения. Нужно просто добиться, чтобы текущие их владельцы оттуда ушли."
 SOV_into_central_asia:0 "В Среднюю Азию"
 SOV_into_central_asia_desc:0 "Завоевание Средней Азии позволит нам угрожать Индии и обеспечит доступ к Персидскому заливу. Стратегическая необходимость такого завоевания очевидна, как очевидно и то, что наша империя от этого не погибнет."
 SOV_the_last_break_southward:0 "Последний прорыв на юг"
 SOV_the_last_break_southward_desc:0 "Проведя последнюю серию завоеваний, мы наконец-то заполучим оставшиеся территории Западной Азии и Босфор, что позволит нам вырвать контроль над этими регионами у Индии и обезопасить свой фланг. Мы наконец-то обретем безусловный доступ к морям, от ближайшего Средиземного вплоть до Индийского океана."
 SOV_rebuild_the_far_eastern_fleet:0 "Возродить дальневосточный флот"
 SOV_rebuild_the_far_eastern_fleet_desc:0 "Если мы хотим защитить свои дальневосточные интересы, не говоря уже о том, чтобы перейти в наступление, мы должны значительно расширить свои кораблестроительные и ремонтные мощности в этом регионе."
 SOV_modernize_the_far_eastern_fleet:0 "Модернизировать дальневосточный флот"
 SOV_modernize_the_far_eastern_fleet_desc:0 "Цусима научила нас, что нельзя полагаться на одну лишь численность. Чтобы по-настоящему доминировать в морских сражениях, нам нужны обученные экипажи и безупречные современные боевые корабли. Новый флот, который мы построим, должен быть способен конкурировать с нашими технологически развитыми соперниками в Тихом океане."
 SOV_memories_of_1905:0 "Память о 1905 годе"
 SOV_memories_of_1905_desc:0 "Война 1905 года до сих пор остается темным пятном в коллективной памяти нашего народа. Надо воспользоваться этим и вдохновить рабочих на монументальные усилия, чтобы создать новый флот, который поможет нам доминировать в Тихом океане — а также разжечь пламя их ненависти, чтобы они сами просили пойти этим флотом на наших старых врагов и отомстить им."
 SOV_the_lonely_island:0 "[SOV.GetLonelyIslandName]"
 SOV_the_lonely_island_desc:0 "[SOV.GetLonelyIslandDesc]"
 SOV_an_empire_in_the_pacific:0 "Империя в Тихом океане"
 SOV_an_empire_in_the_pacific_desc:0 "Наша империя перекинулась за Тихий океан, и нам нужны такие корабли, которые могли бы диктовать нашу волю и влияние в его водах."
 SOV_the_berlin_moscow_axis:0 "Ось Берлин-Москва"
 SOV_the_berlin_moscow_axis_desc:0 "Теперь, когда наше новое правительство твердо следует немецкой и итальянской моделям, нужно восстановить отношения с нашими западными соседями. Если мы сосредоточимся на наших общих взглядах, нам, возможно, удастся образовать крепкий и долгий союз между нашей страной и государством [GER.GetName]."
 SOV_japanese_overtures:0 "Приглашение Японии"
 SOV_japanese_overtures_desc:0 "Теперь, когда наш западный фланг защищен, пора подумать о восточном. У японцев много общего с немцами и больше общего с нашим новым правительством, чем им могло бы показаться. Давайте спросим у немцев, что они думают насчет приглашения в наш союз Японии."
 SOV_the_right_opposition:0 "Правая оппозиция"
 SOV_the_right_opposition_desc:0 "Параноидальная власть Сталина разрушает страну, а его смена курса на массовую коллективизацию и жесткую индустриализацию и подавно. Нужно что-то предпринять и немедленно. Члены правой оппозиции, возглавляемые Бухариным, могут привести нашу страну к славе, вылечить раны, вызванные огрехами управления, и восстановить экономику."
 SOV_the_comintern:0 "Коминтерн"
 SOV_the_comintern_desc:0 "Борьба за освобождение рабочих не ограничивается каким-то одним государством — она глобальна. Мы должны предлагать свою помощь товарищам в любой стране мира и сражаться с силами реакции и контрреволюции везде, где они только обнаружатся."
