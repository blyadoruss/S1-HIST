l_english:
 kn_category:0 "Tic-tac-toe"
 kn_category_desc:0 "Invite any existing country to play, regardless of diplomatic relations. Each country may have one match or invitation at a time. AI accepts and plays at the next daily tick."
 kn_invite:0 "Invite [FROM.GetName] to play"
 kn_invite_desc:0 "We play X and move first. The recipient gets an invitation window with accept and decline buttons. Invitations last 7 game days.\n\nSending an invitation starts a shared 90-day cooldown for all outgoing invitations. Declining or cancelling does not reset it."
 kn_invite_tt:0 "Send a free invitation to §Y[FROM.GetName]§!."
 kn_show_board:0 "Open tic-tac-toe"
 kn_show_board_desc:0 "Show the invitation, current match or last result."
 kn_title:0 "TIC-TAC-TOE"
 kn_opponent_label:0 "Opponent: [?kn_opponent.GetName]\nYour mark: [GetKnMark]"
 kn_status_label:0 "[GetKnStatus]"
 kn_rules:0 "Three in a row wins.\nX moves first."
 kn_mark_x:0 "crosses (X)"
 kn_mark_o:0 "noughts (O)"
 kn_status_incoming:0 "You have been invited to play!\nAccept the invitation?"
 kn_status_outgoing:0 "Invitation sent.\nWaiting for a reply."
 kn_status_your_turn:0 "§GYour turn!§! Click an empty square."
 kn_status_wait:0 "Waiting for your opponent."
 kn_status_win:0 "§GYou won!§!"
 kn_status_loss:0 "§RYou lost.§!"
 kn_status_draw:0 "Draw! The board is full."
 kn_status_declined:0 "Invitation declined."
 kn_status_cancelled:0 "Invitation cancelled."
 kn_status_expired:0 "Invitation expired."
 kn_status_unavailable:0 "Match ended: opponent unavailable."
 kn_accept_label:0 "Accept invitation"
 kn_decline_label:0 "Decline"
 kn_cancel_label:0 "Cancel / resign"
 kn_accept_label_tt:0 "Start the match. The inviting country moves first."
 kn_decline_label_tt:0 "Decline the invitation and free both countries for a new match."
 kn_cancel_label_tt:0 "Cancel a pending invitation, or resign an active match and award the opponent a win."
 kn_close_tt:0 "Hide the window. The match continues; reopen it through decisions."
 kn_cell_tt:0 "Place your mark. Only empty squares can be played, and only on your turn."
 kn_watch_category:0 "Watch other matches"
 kn_watch_category_desc:0 "Active matches between other countries appear here. You do not need to play yourself. Each match is listed once, under the country playing X."
 kn_watch_empty:0 "No active matches to watch"
 kn_watch_empty_desc:0 "Two other countries must accept an invitation and start a match. Pending invitations are not listed."
 kn_watch_match:0 "Watch match: [FROM.GetName]"
 kn_watch_match_desc:0 "Watch this country playing X. The board updates after each move. Watching does not occupy your own match slot."
 kn_watch_title:0 "SPECTATING"
 kn_watch_players:0 "X: [?kn_watch_x.GetName]\nO: [?kn_watch_o.GetName]"
 kn_watch_status:0 "[GetKnWatchStatus]"
 kn_watch_hint:0 "Only participants can play.\nChoose another match through decisions."
 kn_watch_close_tt:0 "Close spectating and return to your own game window."
 kn_watch_unavailable:0 "This match is no longer available."
 kn_watch_x_won:0 "§GX wins: [?kn_watch_x.GetName]§!"
 kn_watch_o_won:0 "§GO wins: [?kn_watch_o.GetName]§!"
 kn_watch_draw:0 "Draw!"
 kn_watch_x_turn:0 "X to move: [?kn_watch_x.GetName]"
 kn_watch_o_turn:0 "O to move: [?kn_watch_o.GetName]"
 kn_invitation_cooldown_tt:0 "90 days have passed since the last invitation was sent."

